    .typing-dots span { width:6px; height:6px; background:#667eea; border-radius:50%; animation:typing 1.4s infinite; display:inline-block; margin:0 2px; }

    .profile-modal.show { display:flex; }
    .profile-card { background:var(--bg-white); border-radius:30px; width:90%; max-width:500px; max-height:85vh; overflow-y:auto; padding:25px; }
    .profile-avatar { width:100px; height:100px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); margin:0 auto 15px; display:flex; align-items:center; justify-content:center; font-size:2.5rem; color:white; background-size:cover; background-position:center; cursor:pointer; }
    .profile-field { margin-bottom:20px; }
    .profile-field label { display:block; font-weight:500; margin-bottom:5px; color:var(--text-secondary); }
    .profile-field input, .profile-field textarea { width:100%; padding:10px; border:2px solid var(--border-color); border-radius:20px; background:var(--input-bg); color:var(--text-primary); }
    .profile-stats { display:flex; justify-content:space-around; margin:20px 0; }

    .notification-permission-banner { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--bg-white); border-radius:50px; padding:10px 20px; box-shadow:0 5px 20px var(--shadow-color); display:flex; gap:15px; align-items:center; z-index:1000; }
    @keyframes slideIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }

<body>
  <div id="loadingScreen"><div class="loader-content"><div class="loader-spinner"></div><p>جاري تحميل التطبيق...</p></div></div>
  <div class="animated-bg" id="animatedBg"></div>
  <div class="container">
    <div id="auth">
      <div class="auth-side"><h1>مرحباً بك! 👋</h1><p>تواصل مع الأصدقاء بكل سهولة وأمان في بيئة عصرية وممتعة</p></div>
      <div class="auth-main">
        <div class="auth-form-container">
          <div class="auth-tabs"><button class="auth-tab active" id="loginTab" onclick="switchAuthTab('login')">تسجيل الدخول</button><button class="auth-tab" id="registerTab" onclick="switchAuthTab('register')">حساب جديد</button></div>
          <div id="loginForm"> ... </div> <!-- نفس محتوى النموذج السابق -->
          <div id="registerForm" style="display:none;"> ... </div>
          <div class="separator-modern">أو</div>
          <button class="btn-modern google" onclick="googleLogin()"><i class="fab fa-google"></i> تسجيل بحساب Google</button>
        </div>
      </div>
    </div>
    <div id="chat">
      <div class="chat-container">
        <div class="chat-main">
          <div class="chat-header">
            <h2><i class="fas fa-comments"></i> المحادثة العامة</h2>
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="connection-status" id="connectionStatus"><i class="fas fa-wifi"></i> <span id="connectionStatusText">متصل</span></div>
              <div class="header-actions-new">
                <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-sun sun-icon"></i></button>
                <button class="btn-icon" onclick="openMyProfile()"><i class="fas fa-user-circle"></i></button>
                <button class="btn-icon" onclick="toggleSearch()"><i class="fas fa-search"></i></button>
                <button class="btn-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
              </div>
            </div>
          </div>
          <div class="search-area" id="searchBar"><div class="search-input-group"><input type="text" id="searchInput" placeholder="ابحث في الرسائل..." class="search-input" oninput="searchMessages(this.value)"><button class="btn-close" onclick="closeSearch()">إلغاء</button></div></div>
          <div id="typingIndicator" class="typing-indicator-new" style="display:none;"><div class="typing-dots"><span></span><span></span><span></span></div><span id="typingText"></span></div>
          <div id="replyIndicator" class="typing-indicator-new" style="display:none;"><i class="fas fa-reply" style="color:#667eea;"></i><span>الرد على <span id="replyToName"></span></span><span style="opacity:0.7;">"<span id="replyText"></span>"</span><button onclick="cancelReply()" style="background:none;border:none;color:var(--danger-color);cursor:pointer;margin-right:auto;"><i class="fas fa-times"></i></button></div>
          <div class="messages-area" id="messages">
            <div class="load-more-container" id="loadMoreContainer" style="display:none;"><button class="load-more-btn" onclick="loadMoreMessages()">تحميل المزيد</button></div>
          </div>
          <div class="input-area-new"><button class="btn-upload" onclick="document.getElementById('imageFileInput').click()"><i class="fas fa-image"></i></button><input type="text" id="messageInput" placeholder="اكتب رسالة..." class="message-input" oninput="handleTyping()"><button class="btn-send" onclick="sendWithReply()"><i class="fas fa-paper-plane"></i></button></div>
        </div>
      </div>
    </div>
  </div>
  <!-- (نفس عناصر private page و modals) -->
  <script>
    // ... Firebase config, constants, DOM elements (إزالة عناصر sidebar) ...

    // كاش الصور إلخ ...
    // دالة isAdmin ...

    // ========== دوال حالة المستخدم للملف الشخصي ==========
    function getUserStatusText(userData) {
      if (userData.online && userData.status === 'online') return '🟢 متصل';
      if (userData.online && userData.status === 'away') return '🟡 غير نشط';
      return '🔴 غير متصل';
    }
    function getStatusColor(userData) {
      if (userData.online && userData.status === 'online') return '#10b981';
      if (userData.online && userData.status === 'away') return '#f59e0b';
      return '#94a3b8';
    }

    // ========== تعديل openUserProfile ليعرض الحالة وزر محادثة خاصة محسن ==========
    window.openUserProfile = async function(userId) {
      if (!currentUser) return;
      if (userId === currentUser.uid) { openMyProfile(); return; }
      currentProfileUserId = userId;
      const userDoc = await db.collection('users').doc(userId).get();
      if (userDoc.exists) {
        const data = userDoc.data();
        userProfileUsername.value = data.username || '';
        userProfileStatus.value = data.statusMessage || '';
        userProfileBio.value = data.bio || '';
        if (data.profileImage) {
          userProfileAvatar.style.backgroundImage = `url('${data.profileImage}')`;
          userProfileAvatar.style.backgroundSize = 'cover';
          userProfileAvatar.innerHTML = '';
        } else {
          userProfileAvatar.style.backgroundImage = '';
          userProfileAvatar.innerHTML = data.username?.charAt(0).toUpperCase() || '';
        }
        const joinedDate = data.createdAt?.toDate();
        userProfileJoined.textContent = joinedDate ? formatTimeAgo(joinedDate) : 'غير معروف';
        // عرض الحالة
        const statusText = getUserStatusText(data);
        const statusColor = getStatusColor(data);
        document.getElementById('userProfileStatusDisplay')?.remove();
        const statusEl = document.createElement('div');
        statusEl.id = 'userProfileStatusDisplay';
        statusEl.style.cssText = `text-align:center; margin:10px 0; font-size:1rem; color:${statusColor}; font-weight:500;`;
        statusEl.textContent = statusText;
        const avatar = document.querySelector('#userProfileModal .profile-avatar');
        if (avatar) avatar.insertAdjacentElement('afterend', statusEl);
        // إحصائيات...
        const publicCount = await db.collection('messages').where('uid', '==', userId).get();
        const privateCount = await db.collection('private_messages').where('uid', '==', userId).get();
        userProfileMessages.textContent = publicCount.size + privateCount.size;
        // زر المحادثة الخاصة منسق
        const startBtn = document.getElementById('startPrivateChatBtn');
        if (startBtn) {
          startBtn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
          startBtn.style.color = 'white';
          startBtn.innerHTML = '<i class="fas fa-comment-dots"></i> محادثة خاصة';
        }
        userProfileModal.classList.add('show');
      }
    };

    // ========== تحديث الاسم في جميع فقاعات الرسائل بعد تغييره ==========
    function updateAllOwnMessagesUsername(newUsername) {
      const allBubbles = document.querySelectorAll('.message-bubble');
      allBubbles.forEach(bubble => {
        if (bubble.dataset.uid === currentUser?.uid) {
          const senderSpan = bubble.querySelector('.message-sender');
          if (senderSpan) {
            // الحفاظ على أي badge إلخ إن وجد، فقط تحديث النص الأول
            const firstText = senderSpan.childNodes[0];
            if (firstText && firstText.nodeType === Node.TEXT_NODE) {
              firstText.textContent = newUsername;
            } else {
              senderSpan.innerHTML = escapeHtml(newUsername) + (senderSpan.innerHTML.includes('admin-badge') ? senderSpan.querySelector('.admin-badge').outerHTML : '');
            }
          }
        }
      });
    }

    // تعديل saveMyProfile لاستدعاء التحديث
    window.saveMyProfile = async function() {
      // ... التحقق ...
      await db.collection('users').doc(currentUser.uid).update(updateData);
      currentUsername = newUsername;
      setCachedAvatar(currentUser.uid, userDoc.data()?.profileImage || null);
      updateAllOwnMessagesUsername(newUsername);
      showToast('✅ تم حفظ التغييرات بنجاح');
      closeMyProfile();
    };

    // ========== تقييد الحذف للإدمن فقط ==========
    window.deleteMessage = async function(messageId) {
      if (!currentUser) { showToast('❌ يجب تسجيل الدخول', 'error'); return; }
      if (!isAdmin(currentUser.email)) { showToast('❌ فقط الأدمن يمكنه حذف الرسائل', 'error'); return; }
      // ... تنفيذ الحذف ...
    };

    // في قائمة السياق: عرض زر الحذف فقط إذا كان أدمن
    document.addEventListener('contextmenu', function(e) {
      // ...
      if (isAdmin(currentUser?.email)) {
        html += `<button onclick="deleteMessage('${messageId}')" ...><i class="fas fa-trash"></i> حذف</button>`;
      }
      // ...
    });

    // ========== إصلاح forgot password ==========
    window.showForgotPasswordModal = function() {
      forgotPasswordModal.classList.add('show');
      resetEmail.value = '';
      resetEmailValidation.style.display = 'none';
      forgotPasswordMessage.innerHTML = '';
      resetLoading.style.display = 'none';
      sendResetBtn.disabled = false;
      cancelResetBtn.disabled = false;
    };

    window.sendPasswordReset = async function() {
      if (sendResetBtn.disabled) return; // منع إرسال متعدد
      // ... التحقق ...
      sendResetBtn.disabled = true;
      cancelResetBtn.disabled = true;
      // ... بعد النجاح/الفشل نعيد sendResetBtn.disabled = false; ...
    };

    // إلغاء loadOnlineUsers تماماً من auth.onAuthStateChanged
    // إلغاء أي استدعاء لـ renderUserList إلخ...
  </script>
</body>
</html>
