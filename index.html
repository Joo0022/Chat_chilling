    // DOM Elements (اختصاراً نذكر المهم منها)
    const loadingScreen = document.getElementById('loadingScreen');
    const authDiv = document.getElementById('auth');
    const chatDiv = document.getElementById('chat');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const onlineList = document.getElementById('onlineList');
    const privatePage = document.getElementById('privatePage');
    const privateMessages = document.getElementById('privateMessages');
    const privateInput = document.getElementById('privateInput');
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const resetEmail = document.getElementById('resetEmail');
    const sendResetBtn = document.getElementById('sendResetBtn');
    const cancelResetBtn = document.getElementById('cancelResetBtn');
    const resetLoading = document.getElementById('resetLoading');
    const forgotPasswordMessage = document.getElementById('forgotPasswordMessage');
    const connectionStatus = document.getElementById('connectionStatus');
    const connectionStatusText = document.getElementById('connectionStatusText');

    let currentUser = null;
    let currentUsername = '';
    let unsubscribePublic = null;
    let unsubscribePrivate = null;
    let unsubscribeOnline = null;
    let activePartner = null;
    let typingTimeout;
    let isTyping = false;
    let replyingTo = null;
    let selectedImageFile = null;
    let currentImageMessageContext = null;
    let unreadPrivateMessages = {};
    let notificationsEnabled = false;
    let isUpdatingMessages = false;
    const MESSAGES_LIMIT = 50;
    let isResettingPassword = false;

    const userColors = new Map();
    const availableColors = Array.from({ length: 12 }, (_, i) => `user-color-${i + 1}`);
    let colorIndex = 0;

    // ========== دوال مساعدة ==========
    function showToast(msg, type='success') {
      const toast = document.createElement('div');
      toast.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${type==='success'?'#48bb78':'#f56565'};color:white;padding:12px 24px;border-radius:50px;z-index:10000;animation:slideIn 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);font-weight:500;`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
    function escapeHtml(unsafe) { if (!unsafe) return ''; return String(unsafe).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m)).replace(/["']/g, m => m==='"'?'&quot;':'&#039;'); }
    function isAdmin(email) { return email && ADMIN_EMAILS.includes(email); }
    function getUserColorClass(uid) { if(!userColors.has(uid)) { userColors.set(uid, availableColors[colorIndex % availableColors.length]); colorIndex++; } return userColors.get(uid); }
    function scrollToBottom(el, force=false) { if(!el) return; requestAnimationFrame(() => { const dist = el.scrollHeight - el.scrollTop - el.clientHeight; if(dist < 150 || force) el.scrollTop = el.scrollHeight; }); }
    
    // ========== إدارة الاتصال ==========
    function updateConnectionStatus(online) {
      if(online) { connectionStatus.className = 'connection-status online'; connectionStatusText.textContent = 'متصل'; }
      else { connectionStatus.className = 'connection-status offline'; connectionStatusText.textContent = 'غير متصل'; }
    }
    function setupConnectionMonitoring() {
      window.addEventListener('online', () => { updateConnectionStatus(true); if(currentUser) { loadPublicMessages(); loadOnlineUsers(); } });
      window.addEventListener('offline', () => updateConnectionStatus(false));
      updateConnectionStatus(navigator.onLine);
    }

    // ========== تحميل الرسائل العامة (مع إعادة اشتراك تلقائية) ==========
    function loadPublicMessages() {
      if(unsubscribePublic) unsubscribePublic();
      const query = db.collection('messages').orderBy('createdAt','asc').limit(MESSAGES_LIMIT);
      const handleSnapshot = (snapshot) => {
        if(isUpdatingMessages) return;
        isUpdatingMessages = true;
        const wasNearBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 100;
        messagesDiv.innerHTML = '';
        if(snapshot.empty) { messagesDiv.innerHTML = '<div class="no-messages">لا توجد رسائل بعد...</div>'; isUpdatingMessages = false; return; }
        snapshot.forEach(doc => {
          const msg = doc.data();
          if(!msg.text && !msg.imageUrl) return;
          const div = document.createElement('div');
          const isOwn = msg.uid === currentUser?.uid;
          div.className = `message-bubble ${isOwn ? 'own' : 'other'}`;
          if(!isOwn) div.classList.add(getUserColorClass(msg.uid));
          div.dataset.messageId = doc.id; div.dataset.uid = msg.uid;
          let time = ''; if(msg.createdAt?.toDate) { const d = msg.createdAt.toDate(); time = `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`; }
          let content = '';
          if(!isOwn) {
            let sender = `<span class="message-sender">${escapeHtml(msg.username||'مجهول')}`;
            if(isAdmin(msg.email)) sender += ` <span class="admin-badge"><i class="fas fa-crown"></i> أدمن</span>`;
            sender += `</span>`; content += sender;
          }
          if(msg.replyTo) content += `<div style="background:rgba(0,0,0,0.1);padding:6px;border-radius:8px;margin-bottom:6px;font-size:0.8rem;"><i class="fas fa-reply"></i> ${escapeHtml(msg.replyTo.username)}: ${escapeHtml(msg.replyTo.text.substring(0,30))}</div>`;
          if(msg.text) content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
          if(msg.imageUrl) content += `<img src="${escapeHtml(msg.imageUrl)}" class="message-image" onclick="showFullImage('${escapeHtml(msg.imageUrl)}')">`;
          content += `<div class="reactions-wrapper" id="reactions-${doc.id}"></div><div class="message-time">${time}</div>`;
          div.innerHTML = content;
          messagesDiv.appendChild(div);
          // loadReactions(doc.id); // اختصاراً
        });
        if(wasNearBottom) scrollToBottom(messagesDiv, true);
        isUpdatingMessages = false;
      };
      const handleError = (error) => {
        console.error('Public messages error:', error);
        isUpdatingMessages = false;
        if(currentUser) { showToast('⚠️ مشكلة في الاتصال، جاري إعادة المحاولة...', 'warning'); setTimeout(() => { if(currentUser) loadPublicMessages(); }, 3000); }
      };
      unsubscribePublic = query.onSnapshot(handleSnapshot, handleError);
    }

    // ========== إرسال الرسائل (مع فحص اتصال إنترنت بسيط) ==========
    async function sendWithReply() {
      if(!currentUser) return;
      const text = messageInput.value.trim();
      if(!text) return;
      if(!navigator.onLine) { showToast('❌ لا يوجد اتصال بالإنترنت', 'error'); return; }
      let msgData = { text, username: currentUsername, uid: currentUser.uid, email: currentUser.email, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      if(replyingTo) msgData.replyTo = replyingTo;
      try {
        await db.collection('messages').add(msgData);
        messageInput.value = '';
        cancelReply();
        scrollToBottom(messagesDiv, true);
      } catch(e) {
        showToast('❌ فشل إرسال الرسالة: ' + e.message, 'error');
      }
    }

    async function sendPrivateMessage() {
      if(!currentUser || !activePartner) return;
      const text = privateInput.value.trim();
      if(!text) return;
      if(!navigator.onLine) { showToast('❌ لا يوجد اتصال بالإنترنت', 'error'); return; }
      const roomId = currentUser.uid < activePartner.uid ? currentUser.uid + '_' + activePartner.uid : activePartner.uid + '_' + currentUser.uid;
      try {
        await db.collection('private_messages').add({ text, username: currentUsername, uid: currentUser.uid, email: currentUser.email, toUid: activePartner.uid, roomId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        privateInput.value = '';
        scrollToBottom(privateMessages, true);
      } catch(e) {
        showToast('❌ فشل إرسال الرسالة الخاصة: ' + e.message, 'error');
      }
    }

    // ========== استعادة كلمة المرور (مع منع التكرار) ==========
    async function sendPasswordReset() {
      if(isResettingPassword) return;
      const emailVal = resetEmail.value.trim();
      if(!emailVal) { forgotPasswordMessage.innerHTML = '❌ الرجاء إدخال البريد الإلكتروني'; return; }
      if(!validateResetEmail()) return;
      isResettingPassword = true;
      sendResetBtn.disabled = true;
      cancelResetBtn.disabled = true;
      resetLoading.style.display = 'block';
      try {
        await auth.sendPasswordResetEmail(emailVal);
        forgotPasswordMessage.innerHTML = '✅ تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني';
        setTimeout(() => hideForgotPasswordModal(), 3000);
      } catch(e) {
        let msg = '❌ حدث خطأ: ' + e.message;
        if(e.code === 'auth/user-not-found') msg = '❌ لا يوجد حساب بهذا البريد';
        else if(e.code === 'auth/too-many-requests') msg = '❌ محاولات كثيرة، حاول لاحقاً';
        forgotPasswordMessage.innerHTML = msg;
      } finally {
        resetLoading.style.display = 'none';
        sendResetBtn.disabled = false;
        cancelResetBtn.disabled = false;
        isResettingPassword = false;
      }
    }

    {
    function toggleSidebar() { document.querySelector('.users-sidebar').classList.toggle('show'); }
    function createAnimatedBg() { const bg = document.getElementById('animatedBg'); for (let i = 0; i < 15; i++) { const span = document.createElement('span'); span.style.left = Math.random() * 100 + '%'; span.style.width = Math.random() * 30 + 10 + 'px'; span.style.height = span.style.width; span.style.animationDuration = Math.random() * 20 + 10 + 's'; span.style.animationDelay = Math.random() * 5 + 's'; bg.appendChild(span); } }
    window.copyMessage = function(text) { navigator.clipboard.writeText(text); showToast('✅ تم النسخ'); };
    window.deleteMessage = async function(messageId) { if (!currentUser) { showToast('❌ يجب تسجيل الدخول أولاً', 'error'); return; } try { const msgDoc = await db.collection('messages').doc(messageId).get(); if (!msgDoc.exists) { showToast('❌ الرسالة غير موجودة', 'error'); return; } const msgData = msgDoc.data(); if (msgData.uid !== currentUser.uid) { showToast('❌ لا يمكنك حذف رسائل الآخرين', 'error'); return; } if (confirm('هل أنت متأكد من حذف هذه الرسالة؟')) { await db.collection('messages').doc(messageId).delete(); showToast('✅ تم حذف الرسالة'); } } catch (err) { showToast('❌ فشل الحذف', 'error'); } };
    document.addEventListener('contextmenu', function(e) { const messageElement = e.target.closest('.message-bubble'); if (!messageElement || !currentUser) return; e.preventDefault(); const messageId = messageElement.dataset.messageId; const messageText = messageElement.querySelector('.message-text')?.textContent || ''; const senderName = messageElement.querySelector('.message-sender')?.textContent || ''; const messageOwnerId = messageElement.dataset.uid; const menu = document.createElement('div'); menu.style.cssText = `position:fixed;left:${e.pageX}px;top:${e.pageY}px;background:var(--bg-white);border-radius:12px;box-shadow:0 10px 30px var(--shadow-color);padding:5px;z-index:10000;border:1px solid var(--border-color);`; let menuHTML = `<button onclick="copyMessage('${escapeHtml(messageText)}')" style="display:block;width:100%;padding:8px 16px;border:none;background:none;text-align:right;cursor:pointer;border-radius:8px;color:var(--text-primary);"><i class="fas fa-copy"></i> نسخ</button><button onclick="setReply('${messageId}', '${escapeHtml(messageText)}', '${escapeHtml(senderName)}')" style="display:block;width:100%;padding:8px 16px;border:none;background:none;text-align:right;cursor:pointer;border-radius:8px;color:var(--text-primary);"><i class="fas fa-reply"></i> رد</button>`; if (messageOwnerId === currentUser.uid) menuHTML += `<button onclick="deleteMessage('${messageId}')" style="display:block;width:100%;padding:8px 16px;border:none;background:none;text-align:right;cursor:pointer;border-radius:8px;color:#f56565;"><i class="fas fa-trash"></i> حذف</button>`; menu.innerHTML = menuHTML; document.body.appendChild(menu); setTimeout(() => { document.addEventListener('click', function removeMenu() { menu.remove(); document.removeEventListener('click', removeMenu); }, { once: true }); }, 100); });
    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); sendWithReply(); } });
    privateInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); sendPrivateMessage(); } });
    document.addEventListener('click', (e) => { if (!e.target.closest('.users-sidebar') && !e.target.closest('[onclick="toggleSidebar()"]')) document.querySelector('.users-sidebar').classList.remove('show'); });

    auth.onAuthStateChanged(async (user) => {
      if (user && user.emailVerified) {
        currentUser = user;
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            const data = userDoc.data();
            const emailUsername = user.email.split('@')[0].substring(0, 15);
            if (data.username && data.username !== emailUsername) {
              currentUsername = data.username;
            } else {
              currentUsername = data.username || emailUsername;
            }
            if (data.emailVerified !== true) {
              await db.collection('users').doc(user.uid).update({ emailVerified: true });
            }
          } else {
            currentUsername = user.email.split('@')[0].substring(0,15);
            await db.collection('users').doc(user.uid).set({
              username: currentUsername,
              email: user.email,
              online: true,
              status: 'online',
              emailVerified: true,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
              lastActive: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          await setupUserPresence();
          setupActivityMonitor();
          setupConnectionMonitoring();
          loadPublicMessages();
          loadOnlineUsers();
          loadTypingIndicators();
          checkNotificationPermission();
          setInterval(() => { if (currentUser && document.visibilityState === 'visible' && !document.hidden) db.collection('users').doc(currentUser.uid).update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp(), lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}); }, 60000);
          authDiv.style.display = 'none';
          chatDiv.style.display = 'block';
          privatePage.classList.remove('show');
          hideLoadingScreen();
        } catch (error) { 
          console.error(error); 
          hideLoadingScreen(); 
        }
      } else {
        hideLoadingScreen();
        authDiv.style.display = 'flex';
        chatDiv.style.display = 'none';
        privatePage.classList.remove('show');
        currentUser = null;
        currentUsername = '';
        activePartner = null;
      }
    });
    createAnimatedBg();
    setTimeout(() => hideLoadingScreen(), 5000);
    window.sendWithReply = sendWithReply;
    window.sendPrivateMessage = sendPrivateMessage;
    window.sendPasswordReset = sendPasswordReset;
    // ... وهكذا.

  </script>
</body>
