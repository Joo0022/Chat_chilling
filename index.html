    /* الهيكل الأساسي */
    .container {

    #loadingScreen {

      left: 0;

    .loader-spinner {
      width: 70px;
      height: 70px;

      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 25px;

    .animated-bg span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      animation: animate 25s linear infinite;
      bottom: -150px;
    }
    @keyframes animate {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    .message-bubble { max-width: 70%; padding: 12px 18px; border-radius: 22px; animation: slideIn 0.2s; position: relative; word-wrap: break-word; }

    .message-text { word-break: break-word; line-height: 1.5; }
    .message-time { font-size: 0.65rem; opacity: 0.6; margin-top: 5px; }
    .message-image { max-width: 220px; max-height: 160px; border-radius: 16px; cursor: pointer; margin-top: 6px; }
    .input-area-new { padding: 15px 24px; background: var(--bg-white); border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; }
    .message-input { flex: 1; padding: 12px 20px; border: 2px solid var(--border-color); border-radius: 40px; background: var(--input-bg); color: var(--text-primary); }
    .btn-send, .btn-upload { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; transition: 0.2s; }
    .btn-send { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .typing-indicator-new { display: flex; align-items: center; gap: 8px; padding: 8px 18px; background: var(--bg-white); border-radius: 40px; width: fit-content; margin: 8px 24px; box-shadow: 0 3px 12px var(--shadow-color); }
    .load-more-btn { background: var(--bg-white); border: none; padding: 8px 16px; border-radius: 30px; margin: 10px auto; display: block; cursor: pointer; color: var(--text-primary); text-align: center; width: fit-content; }
    /* تحجيم الخط */
    .small-font .message-text { font-size: 0.8rem; }
    .medium-font .message-text { font-size: 1rem; }
    .large-font .message-text { font-size: 1.2rem; }
    /* المودال */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 5000; }
    .modal.show { display: flex; }
    .modal-content { background: var(--bg-white); border-radius: 30px; padding: 25px; max-width: 400px; width: 90%; color: var(--text-primary); }
    .notification-permission-banner { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-white); border-radius: 50px; padding: 10px 20px; display: flex; gap: 15px; align-items: center; z-index: 1000; border: 1px solid var(--border-color); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) {
      .auth-side { display: none; }
      .users-sidebar { position: absolute; top: 0; right: -100%; height: 100%; z-index: 1050; width: 280px; transition: right 0.25s; }
      .users-sidebar.show { right: 0; }
      .message-bubble { max-width: 85%; }
    }
  </style>
</head>

    const inviteBtn = document.getElementById('inviteBtn');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const profileSettingsBtn = document.getElementById('profileSettingsBtn');
    const profileModal = document.getElementById('profileModal');
    const profileAvatar = document.getElementById('profileAvatar');
    const navAvatar = document.getElementById('navAvatar');
    const navUsername = document.getElementById('navUsername');
    const customStatusInput = document.getElementById('customStatusInput');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
    const avatarInput = document.getElementById('avatarInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const typingText = document.getElementById('typingText');

    // ========== مساعدات ==========
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${type==='success'?'#48bb78':'#f56565'};color:white;padding:12px 24px;border-radius:50px;z-index:10000;animation:slideIn 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return String(unsafe).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      }).replace(/["']/g, function(m) {
        if (m === '"') return '&quot;';
        return '&#039;';
      });
    }
    function scrollToBottom(element) {
      if (!element) return;
      element.scrollTop = element.scrollHeight;
    }

    // ========== الثيمات ==========
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('chat-theme', theme);
      themeSelect.value = theme;
    }
    function setFontSize(size) {
      const messagesArea = document.querySelector('.messages-area');
      messagesArea.classList.remove('small-font', 'medium-font', 'large-font');
      messagesArea.classList.add(`${size}-font`);
      localStorage.setItem('chat-font-size', size);
      fontSizeSelect.value = size;
    }
    themeSelect.addEventListener('change', (e) => setTheme(e.target.value));
    fontSizeSelect.addEventListener('change', (e) => setFontSize(e.target.value));

    // ========== الملف الشخصي ==========
    function openProfileModal() {
      profileModal.classList.add('show');
      profileAvatar.src = navAvatar.src || 'https://via.placeholder.com/80';
      customStatusInput.value = currentUser?.customStatus || '';
    }
    function closeProfileModal() { profileModal.classList.remove('show'); }
    profileSettingsBtn.addEventListener('click', openProfileModal);
    uploadAvatarBtn.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // ضغط الصورة
      const compressed = await compressImage(file);
      const storageRef = storage.ref(`avatars/${currentUser.uid}`);
      await storageRef.put(compressed);
      const url = await storageRef.getDownloadURL();
      await db.collection('users').doc(currentUser.uid).update({ avatar: url });
      navAvatar.src = url;
      profileAvatar.src = url;
      showToast('تم تحديث الصورة');
    });
    saveProfileBtn.addEventListener('click', async () => {
      const newStatus = customStatusInput.value.trim();
      await db.collection('users').doc(currentUser.uid).update({ customStatus: newStatus });
      currentUser.customStatus = newStatus;
      showToast('تم حفظ الحالة');
      closeProfileModal();
    });
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxSize = 300;
            if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
            else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(resolve, 'image/jpeg', 0.7);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ========== رابط الدعوة ==========
    function generateInviteLink() {
      const inviteCode = btoa(currentUser.uid).slice(0, 10);
      return `${window.location.origin}?ref=${inviteCode}`;
    }
    inviteBtn.addEventListener('click', () => {
      const link = generateInviteLink();
      if (navigator.share) {
        navigator.share({ title: 'انضم إلى المحادثة', text: 'استخدم هذا الرابط للانضمام', url: link });
      } else {
        navigator.clipboard.writeText(link);
        showToast('تم نسخ رابط الدعوة');
      }
    });

    // ========== تحميل المزيد من الرسائل ==========
    async function loadMoreMessages() {
      if (isLoadingMore || allMessagesLoaded) return;
      isLoadingMore = true;
      loadMoreBtn.disabled = true;
      let query = db.collection('messages').orderBy('createdAt', 'desc').limit(20);
      if (lastVisibleDoc) query = query.startAfter(lastVisibleDoc);
      const snapshot = await query.get();
      if (snapshot.empty) {
        allMessagesLoaded = true;
        loadMoreBtn.style.display = 'none';
        isLoadingMore = false;
        return;
      }
      lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
      const existingIds = new Set();
      document.querySelectorAll('.message-bubble').forEach(el => existingIds.add(el.dataset.messageId));
      snapshot.docs.reverse().forEach(doc => {
        if (!existingIds.has(doc.id)) {
          const msg = doc.data();
          const messageDiv = createMessageElement(doc.id, msg);
          messagesDiv.prepend(messageDiv);
        }
      });
      loadMoreBtn.style.display = snapshot.docs.length === 20 ? 'block' : 'none';
      isLoadingMore = false;
      loadMoreBtn.disabled = false;
    }
    function createMessageElement(id, msg) {
      const div = document.createElement('div');
      div.className = `message-bubble ${msg.uid === currentUser?.uid ? 'own' : 'other'}`;
      div.dataset.messageId = id;
      let content = '';
      if (msg.uid !== currentUser?.uid) {
        content += `<span class="message-sender">${escapeHtml(msg.username || 'مجهول')}</span>`;
      }
      if (msg.text) content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
      if (msg.imageUrl) content += `<img src="${msg.imageUrl}" class="message-image" onclick="showFullImage('${msg.imageUrl}')">`;
      if (msg.createdAt?.toDate) {
        const d = msg.createdAt.toDate();
        content += `<div class="message-time">${d.getHours()}:${d.getMinutes()}</div>`;
      }
      div.innerHTML = content;
      return div;
    }
    loadMoreBtn.addEventListener('click', loadMoreMessages);

    // ========== تحميل الرسائل العامة ==========
    function loadPublicMessages() {
      if (unsubscribePublic) unsubscribePublic();
      const firstQuery = db.collection('messages').orderBy('createdAt', 'desc').limit(30);
      unsubscribePublic = firstQuery.onSnapshot(snapshot => {
        if (snapshot.empty && messagesDiv.innerHTML === '') {
          messagesDiv.innerHTML = '<div class="no-messages">لا توجد رسائل بعد...</div>';
        }
        const changes = snapshot.docChanges();
        changes.forEach(change => {
          if (change.type === 'added') {
            const msg = change.doc.data();
            const msgDiv = createMessageElement(change.doc.id, msg);
            messagesDiv.appendChild(msgDiv);
            scrollToBottom(messagesDiv);
          }
        });
        if (snapshot.docs.length) lastVisibleDoc = snapshot.docs[snapshot.docs.length-1];
        loadMoreBtn.style.display = snapshot.docs.length === 30 ? 'block' : 'none';
      });
    }

    // ========== إرسال الرسائل مع ضغط الصور ==========
    async function compressImageForUpload(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxSize = 1024;
            if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
            else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(resolve, 'image/jpeg', 0.8);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    document.getElementById('imageFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const compressed = await compressImageForUpload(file);
      const formData = new FormData();
      formData.append('file', compressed, file.name);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      await db.collection('messages').add({
        imageUrl: data.secure_url,
        username: currentUsername,
        uid: currentUser.uid,
        email: currentUser.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('imageFileInput').value = '';
    });

    // ========== وظائف الدردشة الأساسية ==========
    function sendWithReply() {
      const text = messageInput.value.trim();
      if (!text) return;
      let messageData = {
        text: text,
        username: currentUsername,
        uid: currentUser.uid,
        email: currentUser.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (replyingTo) messageData.replyTo = replyingTo;
      db.collection('messages').add(messageData);
      messageInput.value = '';
      cancelReply();
      scrollToBottom(messagesDiv);
    }
    function handleTyping() {
      if (!currentUser) return;
      clearTimeout(window.typingTimeout);
      db.collection('typing').doc(currentUser.uid).set({ username: currentUsername, isTyping: true, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
      window.typingTimeout = setTimeout(() => {
        db.collection('typing').doc(currentUser.uid).delete();
      }, 2000);
    }
    function cancelReply() {
      replyingTo = null;
      document.getElementById('replyIndicator').style.display = 'none';
    }
    window.toggleSearch = () => {
      const bar = document.getElementById('searchBar');
      bar.style.display = bar.style.display === 'none' ? 'block' : 'none';
    };
    window.toggleSidebar = () => document.querySelector('.users-sidebar').classList.toggle('show');
    window.showFullImage = (url) => {
      const modal = document.getElementById('fullImageModal');
      modal.innerHTML = `<div style="position:relative"><img src="${url}" style="max-width:90vw; max-height:85vh; border-radius:24px;"><button onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.5); border:none; color:white; border-radius:50%; width:40px; height:40px;">✕</button></div>`;
      modal.style.display = 'flex';
    };
    // مراقبة مؤشر الكتابة
    db.collection('typing').onSnapshot(snapshot => {
      const typingUsers = [];
      snapshot.forEach(doc => {
        if (doc.id !== currentUser?.uid && doc.data().isTyping) {
          typingUsers.push(doc.data().username);
        }
      });
      if (typingUsers.length) {
        typingText.textContent = typingUsers.join('، ') + ' يكتب...';
        typingIndicator.style.display = 'flex';
      } else {
        typingIndicator.style.display = 'none';
      }
    });

    // ========== قائمة المستخدمين ==========
    function loadOnlineUsers() {
      if (unsubscribeOnline) unsubscribeOnline();
      unsubscribeOnline = db.collection('users').where('emailVerified', '==', true).onSnapshot(snapshot => {
        let html = '';
        let onlineCount = 0;
        snapshot.forEach(doc => {
          if (doc.id !== currentUser?.uid) {
            const data = doc.data();
            if (data.online) onlineCount++;
            const statusText = data.online ? '🟢 متصل' : '🔴 غير متصل';
            const avatarHtml = data.avatar ? `<img src="${data.avatar}" style="width:42px; height:42px; border-radius:50%; object-fit:cover;">` : `<div class="user-avatar">${(data.username || '?').charAt(0).toUpperCase()}</div>`;
            html += `<div class="user-item" onclick="openPrivateChat('${doc.id}', '${escapeHtml(data.username)}')">
              ${avatarHtml}
              <div class="user-info">
                <div class="user-name">${escapeHtml(data.username)}</div>
                <div class="user-status">${statusText}</div>
                ${data.customStatus ? `<div class="user-last-seen" style="font-size:0.7rem; color:var(--text-light);">${escapeHtml(data.customStatus)}</div>` : ''}
              </div>
            </div>`;
          }
        });
        onlineList.innerHTML = html || '<div class="no-messages">لا يوجد مستخدمين آخرين</div>';
        document.getElementById('onlineCount').textContent = onlineCount;
      });
    }
    window.openPrivateChat = (uid, username) => {
      alert(`فتح محادثة خاصة مع ${username}\n(هذه ميزة تجريبية، يمكن تطويرها لاحقاً)`);
    };

    // ========== المصادقة ==========
    window.login = async function() {
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pwd);
      } catch(e) {
        document.getElementById('loginError').textContent = e.message;
      }
    };
    window.register = async function() {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      const username = document.getElementById('username').value;
      if (!username || username.length > 15) {
        document.getElementById('registerError').textContent = 'اسم المستخدم مطلوب وأقل من 15 حرف';
        return;
      }
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pwd);
        await cred.user.sendEmailVerification();
        await db.collection('users').doc(cred.user.uid).set({
          username, email, emailVerified: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          online: false
        });
        alert('تم إنشاء الحساب، يرجى التحقق من بريدك الإلكتروني');
        auth.signOut();
      } catch(e) {
        document.getElementById('registerError').textContent = e.message;
      }
    };
    window.googleLogin = async () => {
      try {
        const result = await auth.signInWithPopup(googleProvider);
        const user = result.user;
        const username = user.email.split('@')[0].substring(0,15);
        await db.collection('users').doc(user.uid).set({
          username, email: user.email, emailVerified: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          online: true
        }, { merge: true });
      } catch(e) {
        alert(e.message);
      }
    };
    window.logout = async () => {
      if (currentUser) {
        await db.collection('users').doc(currentUser.uid).update({ online: false });
      }
      await auth.signOut();
      location.reload();
    };
    window.showForgotPasswordModal = () => {
      const email = prompt('أدخل بريدك الإلكتروني لإعادة تعيين كلمة المرور');
      if (email) auth.sendPasswordResetEmail(email).then(() => alert('تم إرسال رابط إعادة التعيين')).catch(e => alert(e.message));
    };
    // إشعارات
    window.requestNotificationPermission = () => {
      if ('Notification' in window) {
        Notification.requestPermission().then(perm => {
          if (perm === 'granted') {
            document.getElementById('notificationBanner').style.display = 'none';
            showToast('تم تفعيل الإشعارات');
          }
        });
      }
    };
    function closeNotificationBanner() {
      document.getElementById('notificationBanner').style.display = 'none';
    }

    // ========== مراقبة حالة المصادقة ==========
    auth.onAuthStateChanged(async (user) => {
      if (user && user.emailVerified) {
        currentUser = user;
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists) {
          currentUsername = user.email.split('@')[0].substring(0,15);
          await db.collection('users').doc(user.uid).set({
            username: currentUsername,
            email: user.email,
            emailVerified: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            online: true
          });
        } else {
          currentUsername = userDoc.data().username;
          navUsername.innerText = currentUsername;
          if (userDoc.data().avatar) navAvatar.src = userDoc.data().avatar;
          if (userDoc.data().customStatus) customStatusInput.value = userDoc.data().customStatus;
          currentUser.customStatus = userDoc.data().customStatus || '';
        }
        // تحديث حالة الاتصال
        await db.collection('users').doc(user.uid).update({ online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
        db.collection('users').doc(user.uid).onDisconnect().update({ online: false });
        authDiv.style.display = 'none';
        chatDiv.style.display = 'flex';
        loadPublicMessages();
        loadOnlineUsers();
        const savedTheme = localStorage.getItem('chat-theme') || 'light';
        setTheme(savedTheme);
        const savedFont = localStorage.getItem('chat-font-size') || 'medium';
        setFontSize(savedFont);
        loadingScreen.classList.add('hidden');
      } else {
        authDiv.style.display = 'flex';
        chatDiv.style.display = 'none';
        loadingScreen.classList.add('hidden');
      }
    });

    // خلفية متحركة
    const bg = document.getElementById('animatedBg');
    for (let i = 0; i < 30; i++) {
      const span = document.createElement('span');
      span.style.left = Math.random() * 100 + '%';
      span.style.width = span.style.height = Math.random() * 30 + 10 + 'px';
      span.style.animationDuration = Math.random() * 20 + 10 + 's';
      span.style.animationDelay = Math.random() * 5 + 's';
      bg.appendChild(span);
    }

    // Service Worker لتطبيق PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
</html>
