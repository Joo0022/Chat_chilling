<!DOCTYPE html>
<html lang="ar" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Chat_With_Us 💬 | تواصل بسلاسة</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rsbg47X7/8f55b377-3e6f-4bc9-bbc5-9b1ed3057599.png">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      transition: background 0.3s ease;
    }

    /* الثيمات */
    :root[data-theme="light"] {
      --bg-gradient-start: #667eea;
      --bg-gradient-end: #764ba2;
      --container-bg: rgba(255, 255, 255, 0.12);
      --auth-side-bg: linear-gradient(135deg, rgba(102, 126, 234, 0.88), rgba(118, 75, 162, 0.88));
      --auth-main-bg: rgba(255, 255, 255, 0.96);
      --text-primary: #1e293b;
      --text-secondary: #334155;
      --text-light: #64748b;
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --message-own: linear-gradient(135deg, #667eea, #764ba2);
      --message-other: #ffffff;
      --sidebar-bg: #ffffff;
      --input-bg: #ffffff;
      --icon-color: #475569;
      --hover-bg: #f1f5f9;
      --online-status: #10b981;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }
    
    :root[data-theme="dark"] {
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e293b;
      --container-bg: rgba(0, 0, 0, 0.35);
      --auth-side-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      --auth-main-bg: rgba(30, 41, 59, 0.96);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-light: #94a3b8;
      --bg-white: #1e293b;
      --bg-light: #0f172a;
      --border-color: #334155;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --message-own: linear-gradient(135deg, #4f46e5, #7c3aed);
      --message-other: #1e293b;
      --sidebar-bg: #0f172a;
      --input-bg: #1e293b;
      --icon-color: #cbd5e1;
      --hover-bg: #334155;
      --online-status: #10b981;
      --danger-color: #f87171;
      --success-color: #4ade80;
    }

    .container {
      width: 100%;
      height: 100%;
      background: var(--container-bg);
      backdrop-filter: blur(24px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease;
    }
    
    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .loader-spinner {
      width: 70px;
      height: 70px;
      border: 6px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 25px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* شاشة المصادقة */
    #auth {
      height: 100%;
      display: flex;
      flex: 1;
    }
    
    .auth-side {
      flex: 1;
      background: var(--auth-side-bg);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: white;
      text-align: center;
    }
    
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: var(--auth-main-bg);
      backdrop-filter: blur(10px);
    }
    
    .auth-form-container {
      width: 100%;
      max-width: 420px;
    }
    
    .auth-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      background: rgba(102, 126, 234, 0.1);
      padding: 6px;
      border-radius: 60px;
    }
    
    .auth-tab {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .auth-tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    
    .input-group-modern {
      margin-bottom: 20px;
    }
    
    .input-group-modern label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-weight: 500;
    }
    
    .input-modern {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid var(--border-color);
      border-radius: 30px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.3s;
    }
    
    .input-modern:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .btn-modern {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .btn-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .btn-modern.google {
      background: var(--bg-white);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .separator-modern {
      text-align: center;
      margin: 24px 0;
      color: var(--text-light);
      position: relative;
    }
    
    .error-message {
      color: var(--danger-color);
      font-size: 0.8rem;
      text-align: center;
      margin-top: 5px;
      margin-bottom: 10px;
    }
    
    .success-message {
      color: var(--success-color);
      font-size: 0.8rem;
      text-align: center;
      margin-top: 5px;
      margin-bottom: 10px;
    }
    
    /* واجهة الدردشة */
    #chat {
      height: 100%;
      display: none;
      flex: 1;
    }
    
    .chat-container {
      display: flex;
      height: 100%;
      width: 100%;
    }
    
    .users-sidebar {
      width: 290px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .sidebar-header {
      padding: 20px;
      background: var(--auth-side-bg);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .profile-settings {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      padding: 5px 12px;
      border-radius: 40px;
    }
    
    .user-avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }
    
    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-light);
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .user-item:hover {
      transform: translateX(-5px);
      background: var(--hover-bg);
    }
    
    .user-avatar {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }
    
    .user-info {
      flex: 1;
    }
    
    .user-name {
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .user-status {
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: var(--online-status);
    }
    
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-light);
      overflow: hidden;
    }
    
    .chat-header {
      padding: 15px 24px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .theme-selector, .font-size-control {
      background: var(--bg-light);
      border: none;
      padding: 6px 12px;
      border-radius: 30px;
      color: var(--text-primary);
      cursor: pointer;
    }
    
    .btn-icon {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 14px;
      background: var(--bg-light);
      color: var(--icon-color);
      cursor: pointer;
      transition: 0.2s;
    }
    
    .btn-icon:hover {
      background: var(--hover-bg);
      transform: scale(1.05);
    }
    
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .message-bubble {
      max-width: 70%;
      padding: 12px 18px;
      border-radius: 22px;
      animation: slideIn 0.2s;
      position: relative;
      word-wrap: break-word;
    }
    
    .message-bubble.own {
      align-self: flex-end;
      background: var(--message-own);
      color: white;
      border-bottom-right-radius: 5px;
    }
    
    .message-bubble.other {
      align-self: flex-start;
      background: var(--message-other);
      color: var(--text-primary);
      box-shadow: 0 3px 12px var(--shadow-color);
      border-bottom-left-radius: 5px;
    }
    
    .message-text {
      word-break: break-word;
      line-height: 1.5;
    }
    
    .message-time {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 5px;
    }
    
    .input-area-new {
      padding: 15px 24px;
      background: var(--bg-white);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .message-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid var(--border-color);
      border-radius: 40px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 16px;
    }
    
    .message-input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .btn-send, .btn-upload {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    
    .btn-send {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    
    .typing-indicator-new {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--bg-white);
      border-radius: 40px;
      width: fit-content;
      margin: 8px 24px;
      box-shadow: 0 3px 12px var(--shadow-color);
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5000;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background: var(--bg-white);
      border-radius: 30px;
      padding: 25px;
      max-width: 400px;
      width: 90%;
      color: var(--text-primary);
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 768px) {
      .auth-side {
        display: none;
      }
      
      .users-sidebar {
        position: absolute;
        top: 0;
        right: -100%;
        height: 100%;
        z-index: 1050;
        width: 280px;
        transition: right 0.25s;
      }
      
      .users-sidebar.show {
        right: 0;
      }
      
      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <p style="color: white;">جاري تحميل التطبيق...</p>
    </div>
  </div>
  
  <div class="container">
    <div id="auth">
      <div class="auth-side">
        <h1 style="font-size: 2.5rem; margin-bottom: 20px;">مرحباً بك! 👋</h1>
        <p style="font-size: 1.2rem;">تواصل مع الأصدقاء بكل سهولة وأمان</p>
      </div>
      <div class="auth-main">
        <div class="auth-form-container">
          <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab">تسجيل الدخول</button>
            <button class="auth-tab" id="registerTab">حساب جديد</button>
          </div>
          
          <!-- تسجيل الدخول -->
          <div id="loginForm">
            <div class="input-group-modern">
              <label>📧 البريد الإلكتروني</label>
              <input type="email" id="loginEmail" placeholder="example@domain.com" class="input-modern">
            </div>
            <div class="input-group-modern">
              <label>🔒 كلمة المرور</label>
              <input type="password" id="loginPassword" class="input-modern">
            </div>
            <div id="loginError" class="error-message"></div>
            <button class="btn-modern" onclick="login()">تسجيل الدخول</button>
            <div style="text-align: center; margin-top: 15px;">
              <button onclick="showForgotPasswordModal()" style="background: none; border: none; color: #667eea; cursor: pointer; font-size: 14px;">
                نسيت كلمة المرور؟
              </button>
            </div>
          </div>
          
          <!-- التسجيل -->
          <div id="registerForm" style="display: none;">
            <div class="input-group-modern">
              <label>👤 اسم المستخدم (حد أقصى 15)</label>
              <input type="text" id="username" class="input-modern" maxlength="15">
            </div>
            <div class="input-group-modern">
              <label>📧 البريد الإلكتروني</label>
              <input type="email" id="email" class="input-modern">
            </div>
            <div class="input-group-modern">
              <label>🔒 كلمة المرور</label>
              <input type="password" id="password" class="input-modern">
            </div>
            <div class="input-group-modern">
              <label>🔒 تأكيد كلمة المرور</label>
              <input type="password" id="confirmPassword" class="input-modern">
            </div>
            <div id="registerError" class="error-message"></div>
            <button class="btn-modern" onclick="register()">إنشاء حساب</button>
          </div>
          
          <div class="separator-modern">أو</div>
          <button class="btn-modern google" onclick="googleLogin()">
            <i class="fab fa-google"></i> تسجيل بحساب Google
          </button>
        </div>
      </div>
    </div>
    
    <div id="chat">
      <div class="chat-container">
        <div class="users-sidebar">
          <div class="sidebar-header">
            <h3><i class="fas fa-users"></i> المستخدمون <span class="online-count" id="onlineCount">0</span></h3>
            <div class="profile-settings" id="profileSettingsBtn">
              <img id="navAvatar" class="user-avatar-img" src="https://via.placeholder.com/32">
              <span id="navUsername"></span>
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
          <div class="users-list" id="onlineList"></div>
        </div>
        
        <div class="chat-main">
          <div class="chat-header">
            <h2><i class="fas fa-comments"></i> المحادثة العامة</h2>
            <div class="header-actions">
              <select id="themeSelect" class="theme-selector">
                <option value="light">فاتح</option>
                <option value="dark">داكن</option>
              </select>
              <button class="btn-icon" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
              </button>
            </div>
          </div>
          
          <div id="typingIndicator" class="typing-indicator-new" style="display: none;">
            <div class="typing-dots">...</div>
            <span id="typingText"></span>
          </div>
          
          <div style="flex:1; display: flex; flex-direction: column; overflow: hidden;">
            <div class="messages-area" id="messages"></div>
          </div>
          
          <div class="input-area-new">
            <button class="btn-upload" onclick="document.getElementById('imageFileInput').click()">
              <i class="fas fa-image"></i>
            </button>
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." class="message-input" oninput="handleTyping()">
            <button class="btn-send" onclick="sendMessage()">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
  
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 20px;">الملف الشخصي</h3>
      <div style="text-align: center; margin-bottom: 20px;">
        <img id="profileAvatar" src="" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
        <button id="uploadAvatarBtn" class="btn-modern" style="width: auto; padding: 8px 20px;">تغيير الصورة</button>
        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
      </div>
      <div class="input-group-modern">
        <label>الحالة المخصصة</label>
        <input type="text" id="customStatusInput" placeholder="اكتب حالتك..." class="input-modern" maxlength="50">
      </div>
      <button id="saveProfileBtn" class="btn-modern" style="margin-bottom: 10px;">حفظ</button>
      <button class="btn-modern google" onclick="closeProfileModal()">إلغاء</button>
    </div>
  </div>
  
  <div id="fullImageModal" class="modal" onclick="closeFullImage()">
    <div style="position: relative;">
      <img id="fullImage" src="" style="max-width: 90vw; max-height: 85vh; border-radius: 24px;">
    </div>
  </div>

  <script>
    // ========== Firebase Configuration ==========
    const firebaseConfig = {
      apiKey: "AIzaSyANJjbTOFTKUAuT-g1BKY7LU9a4OabSEDQ",
      authDomain: "enhanced-app-492f6.firebaseapp.com",
      projectId: "enhanced-app-492f6",
      storageBucket: "enhanced-app-492f6.firebasestorage.app",
      messagingSenderId: "544947944105",
      appId: "1:544947944105:web:f2ac32d485c8ad68b647b8"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    
    // Cloudinary configuration
    const CLOUD_NAME = "dn0knjzpi";
    const UPLOAD_PRESET = "chat-app";
    
    // ========== متغيرات عامة ==========
    let currentUser = null;
    let currentUsername = '';
    let unsubscribePublic = null;
    let unsubscribeOnline = null;
    let typingTimeout = null;
    
    // ========== مساعدات ==========
    function hideLoadingScreen() {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loadingScreen');
        if (loadingScreen) loadingScreen.classList.add('hidden');
      }, 500);
    }
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: ${type === 'success' ? '#48bb78' : '#f56565'};
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        z-index: 10000;
        animation: slideIn 0.3s;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        font-weight: 500;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
    
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return String(unsafe).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function scrollToBottom() {
      const messagesDiv = document.getElementById('messages');
      if (messagesDiv) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    }
    
    // ========== الثيمات ==========
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('chat-theme', theme);
    }
    
    // ========== الملف الشخصي ==========
    function openProfileModal() {
      const modal = document.getElementById('profileModal');
      if (modal) modal.classList.add('show');
    }
    
    function closeProfileModal() {
      const modal = document.getElementById('profileModal');
      if (modal) modal.classList.remove('show');
    }
    
    // ========== تحميل الرسائل العامة ==========
    function loadPublicMessages() {
      if (unsubscribePublic) unsubscribePublic();
      
      const messagesDiv = document.getElementById('messages');
      if (!messagesDiv) return;
      
      unsubscribePublic = db.collection('messages')
        .orderBy('createdAt', 'asc')
        .limit(50)
        .onSnapshot(snapshot => {
          messagesDiv.innerHTML = '';
          snapshot.forEach(doc => {
            const msg = doc.data();
            const messageDiv = createMessageElement(doc.id, msg);
            messagesDiv.appendChild(messageDiv);
          });
          scrollToBottom();
        }, error => {
          console.error('Error loading messages:', error);
        });
    }
    
    function createMessageElement(id, msg) {
      const div = document.createElement('div');
      div.className = `message-bubble ${msg.uid === currentUser?.uid ? 'own' : 'other'}`;
      
      let content = '';
      if (msg.uid !== currentUser?.uid) {
        content += `<div class="message-sender" style="font-weight: bold; margin-bottom: 5px;">${escapeHtml(msg.username || 'مجهول')}</div>`;
      }
      if (msg.text) {
        content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
      }
      if (msg.imageUrl) {
        content += `<img src="${msg.imageUrl}" class="message-image" style="max-width: 200px; max-height: 150px; border-radius: 12px; margin-top: 8px; cursor: pointer;" onclick="showFullImage('${msg.imageUrl}')">`;
      }
      if (msg.createdAt?.toDate) {
        const d = msg.createdAt.toDate();
        const timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        content += `<div class="message-time">${timeStr}</div>`;
      }
      
      div.innerHTML = content;
      return div;
    }
    
    // ========== إرسال الرسائل ==========
    async function sendMessage() {
      const messageInput = document.getElementById('messageInput');
      const text = messageInput.value.trim();
      if (!text) return;
      
      try {
        await db.collection('messages').add({
          text: text,
          username: currentUsername,
          uid: currentUser.uid,
          email: currentUser.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        messageInput.value = '';
        scrollToBottom();
      } catch (error) {
        console.error('Error sending message:', error);
        showToast('حدث خطأ في إرسال الرسالة', 'error');
      }
    }
    
    function handleTyping() {
      if (!currentUser) return;
      
      clearTimeout(typingTimeout);
      db.collection('typing').doc(currentUser.uid).set({
        username: currentUsername,
        isTyping: true,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      typingTimeout = setTimeout(() => {
        db.collection('typing').doc(currentUser.uid).delete();
      }, 2000);
    }
    
    // مراقبة مؤشر الكتابة
    function setupTypingListener() {
      db.collection('typing').onSnapshot(snapshot => {
        const typingUsers = [];
        snapshot.forEach(doc => {
          if (doc.id !== currentUser?.uid && doc.data().isTyping) {
            typingUsers.push(doc.data().username);
          }
        });
        
        const typingIndicator = document.getElementById('typingIndicator');
        const typingText = document.getElementById('typingText');
        
        if (typingUsers.length > 0) {
          typingText.textContent = typingUsers.join('، ') + ' يكتب...';
          typingIndicator.style.display = 'flex';
        } else {
          typingIndicator.style.display = 'none';
        }
      });
    }
    
    // ========== قائمة المستخدمين ==========
    function loadOnlineUsers() {
      if (unsubscribeOnline) unsubscribeOnline();
      
      unsubscribeOnline = db.collection('users')
        .where('online', '==', true)
        .onSnapshot(snapshot => {
          const onlineList = document.getElementById('onlineList');
          const onlineCountSpan = document.getElementById('onlineCount');
          
          if (!onlineList) return;
          
          let html = '';
          let count = 0;
          
          snapshot.forEach(doc => {
            if (doc.id !== currentUser?.uid) {
              const data = doc.data();
              count++;
              const avatarHtml = data.avatar ? 
                `<img src="${data.avatar}" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover;">` : 
                `<div class="user-avatar">${(data.username || '?').charAt(0).toUpperCase()}</div>`;
              
              html += `
                <div class="user-item">
                  ${avatarHtml}
                  <div class="user-info">
                    <div class="user-name">${escapeHtml(data.username)}</div>
                    <div class="user-status">
                      <span class="status-dot"></span> متصل
                    </div>
                    ${data.customStatus ? `<div style="font-size: 0.7rem; color: var(--text-light);">${escapeHtml(data.customStatus)}</div>` : ''}
                  </div>
                </div>
              `;
            }
          });
          
          onlineList.innerHTML = html || '<div style="text-align: center; padding: 20px; color: var(--text-light);">لا يوجد مستخدمين متصلين</div>';
          if (onlineCountSpan) onlineCountSpan.textContent = count;
        });
    }
    
    // ========== تحميل الصور ==========
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxSize = 800;
            
            if (width > height && width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            } else if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
            
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(resolve, 'image/jpeg', 0.7);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    
    document.getElementById('imageFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      try {
        showToast('جاري رفع الصورة...', 'success');
        const compressed = await compressImage(file);
        const formData = new FormData();
        formData.append('file', compressed);
        formData.append('upload_preset', UPLOAD_PRESET);
        
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        
        await db.collection('messages').add({
          imageUrl: data.secure_url,
          username: currentUsername,
          uid: currentUser.uid,
          email: currentUser.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        showToast('تم رفع الصورة بنجاح', 'success');
        document.getElementById('imageFileInput').value = '';
      } catch (error) {
        console.error('Error uploading image:', error);
        showToast('حدث خطأ في رفع الصورة', 'error');
      }
    });
    
    // ========== عرض الصورة كاملة ==========
    window.showFullImage = (url) => {
      const modal = document.getElementById('fullImageModal');
      const fullImage = document.getElementById('fullImage');
      if (modal && fullImage) {
        fullImage.src = url;
        modal.classList.add('show');
      }
    };
    
    window.closeFullImage = () => {
      const modal = document.getElementById('fullImageModal');
      if (modal) modal.classList.remove('show');
    };
    
    // ========== المصادقة ==========
    window.login = async function() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      
      if (!email || !password) {
        errorDiv.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور';
        return;
      }
      
      try {
        errorDiv.textContent = '';
        const result = await auth.signInWithEmailAndPassword(email, password);
        
        if (!result.user.emailVerified) {
          await auth.signOut();
          errorDiv.textContent = 'الرجاء التحقق من بريدك الإلكتروني أولاً';
          return;
        }
        
        showToast('تم تسجيل الدخول بنجاح', 'success');
      } catch (error) {
        console.error('Login error:', error);
        let message = 'حدث خطأ في تسجيل الدخول';
        if (error.code === 'auth/user-not-found') message = 'البريد الإلكتروني غير مسجل';
        if (error.code === 'auth/wrong-password') message = 'كلمة المرور غير صحيحة';
        if (error.code === 'auth/invalid-email') message = 'البريد الإلكتروني غير صالح';
        errorDiv.textContent = message;
      }
    };
    
    window.register = async function() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('registerError');
      
      if (!username || username.length > 15) {
        errorDiv.textContent = 'اسم المستخدم مطلوب وأقل من 15 حرف';
        return;
      }
      
      if (!email) {
        errorDiv.textContent = 'الرجاء إدخال البريد الإلكتروني';
        return;
      }
      
      if (!password || password.length < 6) {
        errorDiv.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
        return;
      }
      
      if (password !== confirmPassword) {
        errorDiv.textContent = 'كلمة المرور غير متطابقة';
        return;
      }
      
      try {
        errorDiv.textContent = '';
        const result = await auth.createUserWithEmailAndPassword(email, password);
        
        // إرسال بريد التحقق
        await result.user.sendEmailVerification();
        
        // حفظ بيانات المستخدم
        await db.collection('users').doc(result.user.uid).set({
          username: username,
          email: email,
          emailVerified: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          online: false,
          avatar: null,
          customStatus: ''
        });
        
        await auth.signOut();
        showToast('تم إنشاء الحساب بنجاح! الرجاء التحقق من بريدك الإلكتروني', 'success');
        
        // تنظيف الحقول
        document.getElementById('username').value = '';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        document.getElementById('confirmPassword').value = '';
        
        // التبديل إلى تبويب تسجيل الدخول
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('registerTab').classList.remove('active');
        
      } catch (error) {
        console.error('Registration error:', error);
        let message = 'حدث خطأ في إنشاء الحساب';
        if (error.code === 'auth/email-already-in-use') message = 'البريد الإلكتروني مسجل مسبقاً';
        if (error.code === 'auth/invalid-email') message = 'البريد الإلكتروني غير صالح';
        if (error.code === 'auth/weak-password') message = 'كلمة المرور ضعيفة جداً';
        errorDiv.textContent = message;
      }
    };
    
    window.googleLogin = async function() {
      try {
        const result = await auth.signInWithPopup(googleProvider);
        const user = result.user;
        const username = user.email.split('@')[0].substring(0, 15);
        
        const userRef = db.collection('users').doc(user.uid);
        const userDoc = await userRef.get();
        
        if (!userDoc.exists) {
          await userRef.set({
            username: username,
            email: user.email,
            emailVerified: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            online: true,
            avatar: user.photoURL || null,
            customStatus: ''
          });
        } else {
          await userRef.update({ online: true });
        }
        
        showToast('تم تسجيل الدخول بنجاح', 'success');
      } catch (error) {
        console.error('Google login error:', error);
        showToast('حدث خطأ في تسجيل الدخول بحساب Google', 'error');
      }
    };
    
    window.logout = async function() {
      if (currentUser) {
        try {
          await db.collection('users').doc(currentUser.uid).update({ online: false });
        } catch (error) {
          console.error('Error updating online status:', error);
        }
      }
      await auth.signOut();
      showToast('تم تسجيل الخروج بنجاح', 'success');
    };
    
    window.showForgotPasswordModal = function() {
      const email = prompt('أدخل بريدك الإلكتروني لإعادة تعيين كلمة المرور');
      if (email) {
        auth.sendPasswordResetEmail(email)
          .then(() => showToast('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني', 'success'))
          .catch((error) => {
            console.error('Password reset error:', error);
            showToast('حدث خطأ: ' + error.message, 'error');
          });
      }
    };
    
    // ========== إدارة علامات التبويب ==========
    function setupAuthTabs() {
      const loginTab = document.getElementById('loginTab');
      const registerTab = document.getElementById('registerTab');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      
      if (loginTab && registerTab) {
        loginTab.onclick = () => {
          loginTab.classList.add('active');
          registerTab.classList.remove('active');
          loginForm.style.display = 'block';
          registerForm.style.display = 'none';
        };
        
        registerTab.onclick = () => {
          registerTab.classList.add('active');
          loginTab.classList.remove('active');
          loginForm.style.display = 'none';
          registerForm.style.display = 'block';
        };
      }
    }
    
    // ========== إدارة الملف الشخصي ==========
    function setupProfile() {
      const profileSettingsBtn = document.getElementById('profileSettingsBtn');
      const saveProfileBtn = document.getElementById('saveProfileBtn');
      const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
      const avatarInput = document.getElementById('avatarInput');
      
      if (profileSettingsBtn) {
        profileSettingsBtn.onclick = openProfileModal;
      }
      
      if (uploadAvatarBtn && avatarInput) {
        uploadAvatarBtn.onclick = () => avatarInput.click();
        
        avatarInput.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file || !currentUser) return;
          
          try {
            showToast('جاري رفع الصورة...', 'success');
            const compressed = await compressImage(file);
            const storageRef = storage.ref(`avatars/${currentUser.uid}`);
            await storageRef.put(compressed);
            const url = await storageRef.getDownloadURL();
            
            await db.collection('users').doc(currentUser.uid).update({ avatar: url });
            
            const navAvatar = document.getElementById('navAvatar');
            const profileAvatar = document.getElementById('profileAvatar');
            if (navAvatar) navAvatar.src = url;
            if (profileAvatar) profileAvatar.src = url;
            
            showToast('تم تحديث الصورة بنجاح', 'success');
          } catch (error) {
            console.error('Avatar upload error:', error);
            showToast('حدث خطأ في رفع الصورة', 'error');
          }
        };
      }
      
      if (saveProfileBtn) {
        saveProfileBtn.onclick = async () => {
          const customStatusInput = document.getElementById('customStatusInput');
          const newStatus = customStatusInput.value.trim();
          
          if (currentUser) {
            try {
              await db.collection('users').doc(currentUser.uid).update({ customStatus: newStatus });
              showToast('تم حفظ الحالة بنجاح', 'success');
              closeProfileModal();
            } catch (error) {
              console.error('Error saving status:', error);
              showToast('حدث خطأ في حفظ الحالة', 'error');
            }
          }
        };
      }
    }
    
    // ========== مراقبة حالة المصادقة ==========
    auth.onAuthStateChanged(async (user) => {
      try {
        const authDiv = document.getElementById('auth');
        const chatDiv = document.getElementById('chat');
        
        if (user && user.emailVerified) {
          currentUser = user;
          
          // جلب بيانات المستخدم
          const userDoc = await db.collection('users').doc(user.uid).get();
          const userData = userDoc.data();
          
          if (userData) {
            currentUsername = userData.username;
            const navUsername = document.getElementById('navUsername');
            const navAvatar = document.getElementById('navAvatar');
            const profileAvatar = document.getElementById('profileAvatar');
            const customStatusInput = document.getElementById('customStatusInput');
            
            if (navUsername) navUsername.textContent = currentUsername;
            if (navAvatar && userData.avatar) navAvatar.src = userData.avatar;
            if (profileAvatar && userData.avatar) profileAvatar.src = userData.avatar;
            if (customStatusInput && userData.customStatus) customStatusInput.value = userData.customStatus;
          }
          
          // تحديث حالة الاتصال
          await db.collection('users').doc(user.uid).update({ 
            online: true,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          // إعداد عند قطع الاتصال
          db.collection('users').doc(user.uid).onDisconnect().update({ online: false });
          
          // إظهار واجهة الدردشة
          if (authDiv) authDiv.style.display = 'none';
          if (chatDiv) chatDiv.style.display = 'flex';
          
          // تحميل البيانات
          loadPublicMessages();
          loadOnlineUsers();
          setupTypingListener();
          
          // إعداد الثيم
          const savedTheme = localStorage.getItem('chat-theme') || 'light';
          setTheme(savedTheme);
          
          const themeSelect = document.getElementById('themeSelect');
          if (themeSelect) {
            themeSelect.value = savedTheme;
            themeSelect.onchange = (e) => setTheme(e.target.value);
          }
          
        } else {
          // عرض واجهة تسجيل الدخول
          if (authDiv) authDiv.style.display = 'flex';
          if (chatDiv) chatDiv.style.display = 'none';
          
          // تنظيف المستخدم الحالي
          currentUser = null;
          currentUsername = '';
          
          // إعداد علامات التبويب
          setupAuthTabs();
        }
      } catch (error) {
        console.error('Auth state change error:', error);
        showToast('حدث خطأ: ' + error.message, 'error');
      } finally {
        hideLoadingScreen();
      }
    });
    
    // إعدادات إضافية
    setupProfile();
    
    // تأمين: في حال تأخر Firebase
    setTimeout(() => {
      hideLoadingScreen();
    }, 5000);
    
    // Service Worker لتطبيق PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
