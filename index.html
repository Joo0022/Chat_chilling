    /* باقي الأنماط من الملف الأصلي (مختصرة هنا بسبب الطول) */
    /* ... الحفاظ على جميع الأنماط السابقة ... */
    .container { width: 100%; height: 100%; background: var(--container-bg); backdrop-filter: blur(24px); display: flex; flex-direction: column; }
    #auth, #chat { flex: 1; display: flex; }
    .users-sidebar { width: 290px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }

    .user-avatar-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

    .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { max-width: 70%; padding: 12px 18px; border-radius: 22px; position: relative; word-wrap: break-word; }
    .message-bubble.own { align-self: flex-end; background: var(--message-own); color: white; border-bottom-right-radius: 5px; }
    .message-bubble.other { align-self: flex-start; background: var(--message-other); color: var(--text-primary); box-shadow: 0 3px 12px var(--shadow-color); border-bottom-left-radius: 5px; }

  <script>
    // ========== إعداد Firebase ==========
    const firebaseConfig = {
      apiKey: "AIzaSyANJjbTOFTKUAuT-g1BKY7LU9a4OabSEDQ",
      authDomain: "enhanced-app-492f6.firebaseapp.com",
      projectId: "enhanced-app-492f6",
      storageBucket: "enhanced-app-492f6.firebasestorage.app",
      messagingSenderId: "544947944105",
      appId: "1:544947944105:web:f2ac32d485c8ad68b647b8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    const CLOUD_NAME = "dn0knjzpi";
    const UPLOAD_PRESET = "chat-app";
    const ADMIN_EMAILS = ["y83298252@gmail.com", "y83298252@proton.me"];

    // متغيرات عامة
    let currentUser = null;
    let currentUsername = '';
    let unsubscribePublic = null;
    let unsubscribeOnline = null;
    let activePartner = null;
    let replyingTo = null;
    let lastMessageDoc = null;
    let isLoadingMore = false;
    let allMessagesLoaded = false;
    let currentFontSize = 'medium';

    // عناصر DOM
    const loadingScreen = document.getElementById('loadingScreen');
    const authDiv = document.getElementById('auth');
    const chatDiv = document.getElementById('chat');
    const messagesDiv = document.getElementById('messages');
    const onlineList = document.getElementById('onlineList');
    const messageInput = document.getElementById('messageInput');
    const themeSelect = document.getElementById('themeSelect');
    const fontSizeSelect = document.getElementById('fontSizeSelect');
    const inviteBtn = document.getElementById('inviteBtn');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const profileSettingsBtn = document.getElementById('profileSettingsBtn');
    const profileModal = document.getElementById('profileModal');
    const profileAvatar = document.getElementById('profileAvatar');
    const navAvatar = document.getElementById('navAvatar');
    const navUsername = document.getElementById('navUsername');
    const customStatusInput = document.getElementById('customStatusInput');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
    const avatarInput = document.getElementById('avatarInput');

    // ========== مساعدات عامة ==========
    function showToast(msg, type='success') { /* ... */ alert(msg); } // للتبسيط
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    function scrollToBottom(element) { element.scrollTop = element.scrollHeight; }

    // ========== الثيمات وحجم الخط ==========
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('chat-theme', theme);
      themeSelect.value = theme;
    }
    function setFontSize(size) {
      currentFontSize = size;
      const messagesArea = document.querySelector('.messages-area');
      messagesArea.classList.remove('small-font', 'medium-font', 'large-font');
      messagesArea.classList.add(`${size}-font`);
      localStorage.setItem('chat-font-size', size);
      fontSizeSelect.value = size;
    }
    themeSelect.addEventListener('change', (e) => setTheme(e.target.value));
    fontSizeSelect.addEventListener('change', (e) => setFontSize(e.target.value));

    // ========== ملف التعريف (الصورة والحالة) ==========
    function openProfileModal() {
      profileModal.classList.add('show');
      profileAvatar.src = navAvatar.src;
      customStatusInput.value = currentUser?.customStatus || '';
    }
    function closeProfileModal() { profileModal.classList.remove('show'); }
    profileSettingsBtn.addEventListener('click', openProfileModal);
    uploadAvatarBtn.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // ضغط الصورة قبل الرفع
      const compressed = await compressImage(file);
      const storageRef = storage.ref(`avatars/${currentUser.uid}`);
      await storageRef.put(compressed);
      const url = await storageRef.getDownloadURL();
      await db.collection('users').doc(currentUser.uid).update({ avatar: url });
      navAvatar.src = url;
      profileAvatar.src = url;
      showToast('تم تحديث الصورة');
    });
    saveProfileBtn.addEventListener('click', async () => {
      const newStatus = customStatusInput.value.trim();
      await db.collection('users').doc(currentUser.uid).update({ customStatus: newStatus });
      currentUser.customStatus = newStatus;
      showToast('تم حفظ الحالة');
      closeProfileModal();
    });
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxSize = 300;
            if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
            else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(resolve, 'image/jpeg', 0.7);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ========== رابط الدعوة ==========
    function generateInviteLink() {
      const inviteCode = btoa(currentUser.uid).slice(0, 10);
      return `${window.location.origin}?ref=${inviteCode}`;
    }
    inviteBtn.addEventListener('click', () => {
      const link = generateInviteLink();
      if (navigator.share) {
        navigator.share({ title: 'انضم إلى المحادثة', text: 'استخدم هذا الرابط للانضمام', url: link });
      } else {
        navigator.clipboard.writeText(link);
        showToast('تم نسخ رابط الدعوة');
      }
    });

    // ========== ترقيم الرسائل (تحميل المزيد) ==========
    let lastVisible = null;
    async function loadMoreMessages() {
      if (isLoadingMore || allMessagesLoaded) return;
      isLoadingMore = true;
      loadMoreBtn.disabled = true;
      let query = db.collection('messages').orderBy('createdAt', 'desc').limit(20);
      if (lastVisible) query = query.startAfter(lastVisible);
      const snapshot = await query.get();
      if (snapshot.empty) {
        allMessagesLoaded = true;
        loadMoreBtn.style.display = 'none';
        isLoadingMore = false;
        return;
      }
      lastVisible = snapshot.docs[snapshot.docs.length - 1];
      const existingIds = new Set();
      document.querySelectorAll('.message-bubble').forEach(el => existingIds.add(el.dataset.messageId));
      snapshot.docs.reverse().forEach(doc => {
        if (!existingIds.has(doc.id)) {
          const msg = doc.data();
          const messageDiv = createMessageElement(doc.id, msg);
          messagesDiv.prepend(messageDiv);
        }
      });
      loadMoreBtn.style.display = snapshot.docs.length === 20 ? 'block' : 'none';
      isLoadingMore = false;
      loadMoreBtn.disabled = false;
    }
    function createMessageElement(id, msg) {
      const div = document.createElement('div');
      div.className = `message-bubble ${msg.uid === currentUser?.uid ? 'own' : 'other'}`;
      div.dataset.messageId = id;
      let content = '';
      if (msg.uid !== currentUser?.uid) {
        content += `<span class="message-sender">${escapeHtml(msg.username)}</span>`;
      }
      if (msg.text) content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
      if (msg.imageUrl) content += `<img src="${msg.imageUrl}" class="message-image" onclick="showFullImage('${msg.imageUrl}')">`;
      if (msg.createdAt?.toDate) {
        const d = msg.createdAt.toDate();
        content += `<div class="message-time">${d.getHours()}:${d.getMinutes()}</div>`;
      }
      div.innerHTML = content;
      return div;
    }

    // ========== تحميل الرسائل العامة مع الترقيم ==========
    function loadPublicMessages() {
      if (unsubscribePublic) unsubscribePublic();
      const firstQuery = db.collection('messages').orderBy('createdAt', 'desc').limit(30);
      unsubscribePublic = firstQuery.onSnapshot(snapshot => {
        if (snapshot.empty && messagesDiv.innerHTML === '') messagesDiv.innerHTML = '<div class="no-messages">لا توجد رسائل بعد...</div>';
        const changes = snapshot.docChanges();
        changes.forEach(change => {
          if (change.type === 'added') {
            const msg = change.doc.data();
            const msgDiv = createMessageElement(change.doc.id, msg);
            messagesDiv.appendChild(msgDiv);
            scrollToBottom(messagesDiv);
          }
        });
        if (snapshot.docs.length) lastVisible = snapshot.docs[snapshot.docs.length-1];
        loadMoreBtn.style.display = snapshot.docs.length === 30 ? 'block' : 'none';
      });
    }
    loadMoreBtn.addEventListener('click', loadMoreMessages);

    // ========== إرسال الرسائل مع ضغط الصور ==========
    async function compressImageForUpload(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxSize = 1024;
            if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
            else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(resolve, 'image/jpeg', 0.8);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    document.getElementById('imageFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const compressed = await compressImageForUpload(file);
      const formData = new FormData();
      formData.append('file', compressed, file.name);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      await db.collection('messages').add({
        imageUrl: data.secure_url,
        username: currentUsername,
        uid: currentUser.uid,
        email: currentUser.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    // ========== باقي وظائف المصادقة والدردشة ==========
    // (نقوم بإعادة استخدام الكود الأصلي مع التعديلات البسيطة)
    window.login = async function() {
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pwd);
      } catch(e) { alert(e.message); }
    };
    window.register = async function() {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      const username = document.getElementById('username').value;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pwd);
        await cred.user.sendEmailVerification();
        await db.collection('users').doc(cred.user.uid).set({ username, email, emailVerified: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        alert('تم إنشاء الحساب، يرجى التحقق من بريدك الإلكتروني');
        auth.signOut();
      } catch(e) { alert(e.message); }
    };
    window.googleLogin = async () => {
      try {
        await auth.signInWithPopup(googleProvider);
      } catch(e) { alert(e.message); }
    };
    window.logout = async () => {
      await auth.signOut();
      location.reload();
    };
    function sendWithReply() {
      const text = messageInput.value.trim();
      if (!text) return;
      db.collection('messages').add({
        text, username: currentUsername, uid: currentUser.uid, email: currentUser.email,
        replyTo: replyingTo, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      messageInput.value = '';
      replyingTo = null;
      document.getElementById('replyIndicator').style.display = 'none';
    }
    function handleTyping() { /* بسيطة */ }
    function cancelReply() { replyingTo = null; document.getElementById('replyIndicator').style.display = 'none'; }
    window.toggleSearch = () => document.getElementById('searchBar').classList.toggle('show');
    window.closeSearch = () => document.getElementById('searchBar').classList.remove('show');
    window.toggleSidebar = () => document.querySelector('.users-sidebar').classList.toggle('show');
    window.showFullImage = (url) => { /* معاينة */ };
    window.showForgotPasswordModal = () => { /* نافذة استعادة */ };
    window.hideForgotPasswordModal = () => { };
    window.sendPasswordReset = () => { };

    // تحميل المستخدمين
    function loadOnlineUsers() {
      db.collection('users').where('emailVerified', '==', true).onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          if (doc.id !== currentUser?.uid) {
            const data = doc.data();
            html += `<div class="user-item" onclick="openPrivateChat('${doc.id}', '${escapeHtml(data.username)}')">
              <div class="user-avatar">${data.username.charAt(0).toUpperCase()}</div>
              <div class="user-info"><div class="user-name">${escapeHtml(data.username)}</div>
              <div class="user-status">${data.online ? '🟢 متصل' : '🔴 غير متصل'}</div>
              ${data.customStatus ? `<div class="user-last-seen">${escapeHtml(data.customStatus)}</div>` : ''}
              </div>
            </div>`;
          }
        });
        onlineList.innerHTML = html || '<div>لا يوجد مستخدمين</div>';
      });
    }

    // مراقبة حالة المصادقة
    auth.onAuthStateChanged(async (user) => {
      if (user && user.emailVerified) {
        currentUser = user;
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists) {
          currentUsername = user.email.split('@')[0];
          await db.collection('users').doc(user.uid).set({ username: currentUsername, email: user.email, emailVerified: true, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          currentUsername = userDoc.data().username;
          navUsername.innerText = currentUsername;
          if (userDoc.data().avatar) navAvatar.src = userDoc.data().avatar;
          if (userDoc.data().customStatus) customStatusInput.value = userDoc.data().customStatus;
        }
        authDiv.style.display = 'none';
        chatDiv.style.display = 'flex';
        loadPublicMessages();
        loadOnlineUsers();
        // استعادة الإعدادات
        const savedTheme = localStorage.getItem('chat-theme') || 'light';
        setTheme(savedTheme);
        const savedFont = localStorage.getItem('chat-font-size') || 'medium';
        setFontSize(savedFont);
        loadingScreen.classList.add('hidden');
      } else {
        authDiv.style.display = 'flex';
        chatDiv.style.display = 'none';
        loadingScreen.classList.add('hidden');
      }
    });

    // إنشاء الخلفية المتحركة
    const bg = document.getElementById('animatedBg');
    for (let i=0; i<30; i++) {
      const span = document.createElement('span');
      span.style.left = Math.random() * 100 + '%';
      span.style.width = span.style.height = Math.random() * 30 + 10 + 'px';
      span.style.animationDuration = Math.random() * 20 + 10 + 's';
      bg.appendChild(span);
    }

    // Service Worker لتطبيق PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
