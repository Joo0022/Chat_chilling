<!DOCTYPE html>
<html lang="ar" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Chat_With_Us 💬 | تواصل بسلاسة</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rsbg47X7/8f55b377-3e6f-4bc9-bbc5-9b1ed3057599.png">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* --- متغيرات التصميم الجديدة (عصرية - زجاجية) --- */
    :root[data-theme="light"] {
      --bg-primary: #f5f7ff;
      --bg-secondary: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.75);
      --bg-glass-solid: rgba(255, 255, 255, 0.96);
      --text-primary: #0a0f2c;
      --text-secondary: #2d3a6f;
      --text-muted: #6c7aa0;
      --accent-primary: #5b5ce0;
      --accent-gradient: linear-gradient(135deg, #5b5ce0, #8b5cf6);
      --accent-secondary: #f97316;
      --border-light: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 35px -8px rgba(0, 0, 0, 0.12);
      --message-own: linear-gradient(115deg, #5b5ce0, #8b5cf6);
      --message-other: #ffffff;
      --sidebar-bg: rgba(255, 255, 255, 0.85);
      --input-bg: #ffffff;
      --hover-bg: rgba(91, 92, 224, 0.08);
      --online-status: #22c55e;
      --away-status: #f97316;
      --offline-status: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --user-color-1: #FF6B6B;
      --user-color-2: #4ECDC4;
      --user-color-3: #45B7D1;
      --user-color-4: #96CEB4;
      --user-color-5: #FFEAA7;
      --user-color-6: #DDA0DD;
      --user-color-7: #98D8C8;
      --user-color-8: #F7DC6F;
      --user-color-9: #BB8FCE;
      --user-color-10: #82E0AA;
      --user-color-11: #F1948A;
      --user-color-12: #85C1E9;
      --blur-bg: blur(12px);
    }

    :root[data-theme="dark"] {
      --bg-primary: #0c0f1c;
      --bg-secondary: #13172b;
      --bg-glass: rgba(19, 23, 43, 0.8);
      --bg-glass-solid: rgba(19, 23, 43, 0.96);
      --text-primary: #f0f2ff;
      --text-secondary: #cbd5ff;
      --text-muted: #8f9bb3;
      --accent-primary: #7c6ef0;
      --accent-gradient: linear-gradient(135deg, #7c6ef0, #a78bfa);
      --accent-secondary: #fb923c;
      --border-light: rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 35px -8px rgba(0, 0, 0, 0.5);
      --message-own: linear-gradient(115deg, #7c6ef0, #a78bfa);
      --message-other: #1e243f;
      --sidebar-bg: rgba(15, 19, 35, 0.85);
      --input-bg: #1e243f;
      --hover-bg: rgba(124, 110, 240, 0.15);
      --online-status: #4ade80;
      --away-status: #fb923c;
      --offline-status: #6b7280;
      --danger: #f87171;
      --success: #4ade80;
      --user-color-1: #FF8A8A;
      --user-color-2: #6ED4CB;
      --user-color-3: #5FC3E0;
      --user-color-4: #A8D5BA;
      --user-color-5: #FFF2B5;
      --user-color-6: #E6B8E6;
      --user-color-7: #B0E0D6;
      --user-color-8: #FCE96A;
      --user-color-9: #D2B4DE;
      --user-color-10: #A3E4C0;
      --user-color-11: #F5B7B1;
      --user-color-12: #A9D6F0;
      --blur-bg: blur(16px);
    }

    /* --- الهيكل الأساسي --- */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .container {
      width: 100%;
      height: 100%;
      max-width: none;
      background: transparent;
      backdrop-filter: none;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* شاشة تحميل جديدة */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      text-align: center;
    }
    .loader-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(91, 92, 224, 0.2);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* خلفية متحركة أنيقة */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      opacity: 0.4;
    }
    .animated-bg span {
      position: absolute;
      display: block;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(91,92,224,0.2) 0%, rgba(139,92,246,0) 70%);
      border-radius: 50%;
      animation: float 20s infinite linear;
      bottom: -150px;
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    /* ========== شاشة المصادقة بتصميم عصري ========== */
    #auth {
      height: 100%;
      display: flex;
      flex: 1;
    }

    .auth-side {
      flex: 1;
      background: var(--accent-gradient);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-radius: 0;
    }
    .auth-side::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.2) 0%, transparent 70%);
      animation: slowDrift 12s infinite alternate;
    }
    @keyframes slowDrift {
      0% { transform: translate(-5%, -5%); }
      100% { transform: translate(5%, 5%); }
    }
    .auth-side h1 {
      font-size: 2.6rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
      position: relative;
    }
    .auth-side p {
      font-size: 1rem;
      max-width: 350px;
      line-height: 1.7;
      opacity: 0.9;
      position: relative;
    }
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: var(--bg-glass-solid);
      backdrop-filter: var(--blur-bg);
      border-radius: 0;
    }
    .auth-form-container {
      width: 100%;
      max-width: 420px;
    }
    .auth-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      background: var(--bg-secondary);
      padding: 6px;
      border-radius: 60px;
      box-shadow: var(--shadow-sm);
    }
    .auth-tab {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .input-group-modern {
      margin-bottom: 24px;
    }
    .input-group-modern label {
      display: block;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.85rem;
    }
    .input-modern {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--border-light);
      border-radius: 28px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .input-modern:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(91, 92, 224, 0.2);
    }
    .password-wrapper-modern {
      position: relative;
    }
    .password-toggle-modern {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-modern {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--accent-gradient);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-modern:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .btn-modern.google {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1.5px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .separator-modern {
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      position: relative;
    }
    .separator-modern::before,
    .separator-modern::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border-light);
    }
    .separator-modern::before { right: 0; }
    .separator-modern::after { left: 0; }
    .validation-message { font-size: 0.75rem; margin-top: 6px; display: none; }
    .validation-message.success { color: var(--success); display: block; }
    .validation-message.error { color: var(--danger); display: block; }
    .error-message { color: var(--danger); font-size: 0.8rem; margin-top: 5px; text-align: center; }

    /* ========== واجهة الدردشة الحديثة ========== */
    #chat {
      height: 100%;
      display: none;
      flex: 1;
    }
    .chat-container {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .users-sidebar {
      width: 290px;
      background: var(--sidebar-bg);
      backdrop-filter: var(--blur-bg);
      border-left: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: right 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .sidebar-header {
      padding: 20px;
      background: var(--accent-gradient);
      color: white;
    }
    .sidebar-header h3 {
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .online-count {
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(4px);
      border-radius: 24px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .user-item:hover {
      transform: translateX(-4px);
      border-color: var(--accent-primary);
      background: var(--hover-bg);
      box-shadow: var(--shadow-sm);
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      background: var(--accent-gradient);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .user-info {
      flex: 1;
    }
    .user-name { font-weight: 700; color: var(--text-primary); font-size: 0.9rem; }
    .user-status { font-size: 0.7rem; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .user-status.online .status-dot { background: var(--online-status); }
    .user-status.away .status-dot { background: var(--away-status); }
    .user-status.offline .status-dot { background: var(--offline-status); }
    .notification-badge-new {
      background: var(--danger);
      color: white;
      border-radius: 30px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    /* منطقة المحادثة الرئيسية */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-glass);
      backdrop-filter: var(--blur-bg);
      overflow: hidden;
    }
    .chat-header {
      padding: 16px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header h2 {
      color: var(--text-primary);
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-actions-new {
      display: flex;
      gap: 10px;
    }
    .btn-icon, .theme-toggle {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 18px;
      background: var(--bg-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
      backdrop-filter: blur(4px);
    }
    .btn-icon:hover, .theme-toggle:hover {
      background: var(--accent-gradient);
      color: white;
      transform: scale(1.03);
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message-bubble {
      max-width: 70%;
      padding: 12px 18px;
      border-radius: 26px;
      animation: fadeSlide 0.2s ease;
      position: relative;
      transition: all 0.1s;
    }
    .message-bubble.own {
      align-self: flex-end;
      background: var(--message-own);
      color: white;
      border-bottom-right-radius: 8px;
      box-shadow: var(--shadow-sm);
    }
    .message-bubble.other {
      align-self: flex-start;
      background: var(--message-other);
      color: var(--text-primary);
      border-bottom-left-radius: 8px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    .message-sender {
      font-size: 0.7rem;
      margin-bottom: 5px;
      opacity: 0.85;
      font-weight: 600;
      display: inline-block;
      background: rgba(0,0,0,0.1);
      padding: 2px 10px;
      border-radius: 30px;
    }
    .message-text { word-break: break-word; line-height: 1.45; font-size: 0.9rem; }
    .message-time { font-size: 0.65rem; opacity: 0.6; margin-top: 6px; text-align: left; }
    .message-image {
      max-width: 220px;
      max-height: 160px;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .typing-indicator-new {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--bg-glass);
      border-radius: 50px;
      width: fit-content;
      margin: 8px 24px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent-primary);
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    .input-area-new {
      padding: 16px 24px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .message-input {
      flex: 1;
      padding: 12px 20px;
      border: 1.5px solid var(--border-light);
      border-radius: 50px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .btn-send, .btn-upload {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.2rem;
    }
    .btn-send {
      background: var(--accent-gradient);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-upload {
      background: var(--bg-glass);
      color: var(--text-secondary);
    }

    /* المحادثة الخاصة */
    .private-page-new {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-glass-solid);
      backdrop-filter: var(--blur-bg);
      z-index: 2000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .private-page-new.show { display: flex; }
    .private-header-new {
      padding: 16px 24px;
      background: var(--accent-gradient);
      color: white;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
    }
    .private-header-new button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.2s;
    }
    .private-messages-new {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--bg-glass);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .image-preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }
    .image-preview-modal.show { display: flex; }
    .preview-content-new img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 32px;
      box-shadow: var(--shadow-lg);
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .auth-side { display: none; }
      .users-sidebar {
        position: absolute;
        top: 0;
        right: -100%;
        height: 100%;
        z-index: 1050;
        width: 280px;
        transition: right 0.25s ease;
      }
      .users-sidebar.show { right: 0; }
      .message-bubble { max-width: 85%; }
    }
    .no-messages {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .reaction-badge-new {
      background: rgba(128,128,128,0.15);
      border-radius: 40px;
      padding: 4px 10px;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.1s;
    }
    .reaction-badge-new:hover { background: var(--accent-primary); color: white; }
    .user-last-seen { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    .close-preview {
      position: absolute;
      top: 20px;
      right: 30px;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      font-size: 1.5rem;
      border-radius: 50px;
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="loadingScreen"><div class="loader-content"><div class="loader-spinner"></div><p style="color: var(--text-primary);">جاري تحميل التطبيق...</p></div></div>
  <div class="animated-bg" id="animatedBg"></div>
  <div class="container">
    <div id="auth">
      <div class="auth-side"><h1>مرحباً بك! 👋</h1><p>يُوْسِفٌ 》》 تواصل مع الأصدقاء بكل سهولة وأمان في بيئة عصرية وممتعة</p></div>
      <div class="auth-main">
        <div class="auth-form-container">

      if (!userColors.has(userId)) {

    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme') || 'light';

      html.setAttribute('data-theme', newTheme);

    async function setupUserPresence() {
      if (!currentUser) return;
      const userRef = db.collection('users').doc(currentUser.uid);
      const userStatusRef = db.collection('status').doc(currentUser.uid);
      try {
        await userRef.update({ online: true, status: 'online', lastSeen: firebase.firestore.FieldValue.serverTimestamp(), lastActive: firebase.firestore.FieldValue.serverTimestamp() });
        userRef.onDisconnect().update({ online: false, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
        userStatusRef.onDisconnect().set({ uid: currentUser.uid, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
        window.addEventListener('online', () => userRef.update({ online: true, status: 'online', lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}));
        window.addEventListener('offline', () => userRef.update({ online: false, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}));
        window.addEventListener('beforeunload', () => userRef.update({ online: false, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}));
      } catch (err) { console.error(err); }
    }

    function setupActivityMonitor() {
      if (!currentUser) return;
      const userRef = db.collection('users').doc(currentUser.uid);
      let inactivityTimeout, isAway = false, lastActivity = Date.now();
      function updateLastActivity() {
        lastActivity = Date.now();
        if (isAway) { isAway = false; userRef.update({ status: 'online', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}); }
        clearTimeout(inactivityTimeout);
        inactivityTimeout = setTimeout(() => {
          if (document.visibilityState === 'hidden') { isAway = true; userRef.update({ status: 'away', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}); }
          else if (Date.now() - lastActivity > 30000) { isAway = true; userRef.update({ status: 'away', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}); }
        }, 30000);
      }
      ['mousedown', 'keydown', 'touchstart', 'mousemove', 'scroll'].forEach(ev => document.addEventListener(ev, updateLastActivity, { passive: true }));
      document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(inactivityTimeout); isAway = true; userRef.update({ status: 'away', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}); } else updateLastActivity(); });
      updateLastActivity();
    }

    function loadOnlineUsers() {
      if (unsubscribeOnline) unsubscribeOnline();
      unsubscribeOnline = db.collection('users').orderBy('lastActive', 'desc').onSnapshot(snapshot => {
        let html = '', onlineCount = 0, awayCount = 0;
        snapshot.forEach(doc => {
          if (doc.id !== currentUser?.uid) {
            const data = doc.data();
            if (!data.username) return;
            const unreadCount = unreadPrivateMessages[doc.id] || 0;
            const initial = data.username.charAt(0).toUpperCase();
            let statusText = '', statusClass = '', statusDot = '', lastSeenText = '';
            if (data.online === true) {
              if (data.status === 'online') { onlineCount++; statusText = '🟢 متصل'; statusClass = 'online'; statusDot = '<span class="status-dot"></span>'; }
              else if (data.status === 'away') { awayCount++; statusText = '🟡 غير نشط'; statusClass = 'away'; statusDot = '<span class="status-dot away"></span>'; }
              else { onlineCount++; statusText = '🟢 متصل'; statusClass = 'online'; statusDot = '<span class="status-dot"></span>'; }
            } else {
              statusText = '🔴 غير متصل'; statusClass = 'offline'; statusDot = '<span class="status-dot offline"></span>';
              if (data.lastSeen?.toDate) { const lastSeen = data.lastSeen.toDate(), now = new Date(), diffMinutes = Math.floor((now - lastSeen) / 60000); if (diffMinutes < 1) lastSeenText = 'منذ لحظات'; else if (diffMinutes < 60) lastSeenText = `منذ ${diffMinutes} دقيقة`; else lastSeenText = `منذ ${Math.floor(diffMinutes/60)} ساعة`; }
            }
            html += `<div class="user-item" onclick="openPrivateChat('${doc.id}', '${escapeHtml(data.username)}')"><div class="user-avatar">${initial}</div><div class="user-info"><div class="user-name">${escapeHtml(data.username)}</div><div class="user-status ${statusClass}">${statusDot} ${statusText}</div>${lastSeenText ? `<div class="user-last-seen">آخر ظهور: ${lastSeenText}</div>` : ''}</div>${unreadCount > 0 ? `<span class="notification-badge-new">${unreadCount}</span>` : ''}</div>`;
          }
        });
        onlineList.innerHTML = html || '<div class="no-messages">لا يوجد مستخدمين آخرين</div>';
        document.getElementById('onlineCount').textContent = `${onlineCount} متصل، ${awayCount} غير نشط`;
      }, error => { onlineList.innerHTML = '<div class="no-messages">خطأ في تحميل المستخدمين</div>'; });
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${type==='success'?'#48bb78':'#f56565'};color:white;padding:12px 24px;border-radius:50px;z-index:10000;animation:slideIn 0.3s ease;box-shadow:0 10px 30px rgba(0,0,0,0.2);font-weight:500;`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    function escapeHtml(unsafe) { if (!unsafe) return ''; return String(unsafe).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }).replace(/["']/g, function(m) { if (m === '"') return '&quot;'; return '&#039;'; }).replace(/`/g, '&#96;'); }

    function scrollToBottom(element, force = false) {
      if (!element) return;
      if (scrollAnimationFrame) cancelAnimationFrame(scrollAnimationFrame);
      scrollAnimationFrame = requestAnimationFrame(() => {
        const distanceFromBottom = element.scrollHeight - element.scrollTop - element.clientHeight;
        if (distanceFromBottom < 150 || force) element.scrollTop = element.scrollHeight;
        scrollAnimationFrame = null;
      });
    }

    // Auth functions
    window.switchAuthTab = function(tab) {
      if (tab === 'login') { loginTab.classList.add('active'); registerTab.classList.remove('active'); loginForm.style.display = 'block'; registerForm.style.display = 'none'; loginError.style.display = 'none'; registerError.style.display = 'none'; }
      else { registerTab.classList.add('active'); loginTab.classList.remove('active'); registerForm.style.display = 'block'; loginForm.style.display = 'none'; loginError.style.display = 'none'; registerError.style.display = 'none'; }
    };
    window.togglePasswordVisibility = function(inputId, button) { const input = document.getElementById(inputId), icon = button.querySelector('i'); if (input.type === 'password') { input.type = 'text'; icon.className = 'far fa-eye-slash'; } else { input.type = 'password'; icon.className = 'far fa-eye'; } };
    window.validateEmail = function() { const emailVal = email.value.trim(), emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; const isValid = emailRegex.test(emailVal); if (!emailVal) { emailValidation.style.display = 'none'; return false; } emailValidation.style.display = 'block'; if (isValid) { emailValidation.className = 'validation-message success'; emailValidation.innerHTML = '✅ البريد الإلكتروني صالح'; } else { emailValidation.className = 'validation-message error'; emailValidation.innerHTML = '❌ البريد الإلكتروني غير صالح'; } return isValid; };
    window.validateLoginEmail = function() { const emailVal = loginEmail.value.trim(), emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; const isValid = emailRegex.test(emailVal); if (!emailVal) { loginEmailValidation.style.display = 'none'; return false; } loginEmailValidation.style.display = 'block'; if (isValid) { loginEmailValidation.className = 'validation-message success'; loginEmailValidation.innerHTML = '✅ البريد الإلكتروني صالح'; } else { loginEmailValidation.className = 'validation-message error'; loginEmailValidation.innerHTML = '❌ البريد الإلكتروني غير صالح'; } return isValid; };
    window.validatePassword = function() { const passVal = password.value; document.getElementById('req-length').style.color = passVal.length >= 8 ? '#48bb78' : 'var(--text-light)'; document.getElementById('req-capital').style.color = /[A-Z]/.test(passVal) ? '#48bb78' : 'var(--text-light)'; document.getElementById('req-number').style.color = /\d/.test(passVal) ? '#48bb78' : 'var(--text-light)'; document.getElementById('req-length').innerHTML = (passVal.length >= 8 ? '✅' : '❌') + ' 8 أحرف على الأقل'; document.getElementById('req-capital').innerHTML = (/[A-Z]/.test(passVal) ? '✅' : '❌') + ' حرف كبير (A-Z)'; document.getElementById('req-number').innerHTML = (/\d/.test(passVal) ? '✅' : '❌') + ' رقم (0-9)'; };

          hideLoadingScreen();
        } catch (error) { console.error(error); hideLoadingScreen(); }
      } else { hideLoadingScreen(); authDiv.style.display = 'flex'; chatDiv.style.display = 'none'; privatePage.classList.remove('show'); currentUser = null; currentUsername = ''; activePartner = null; }
    });
    createAnimatedBg();
    setTimeout(() => hideLoadingScreen(), 5000);
  </script>
</body>
