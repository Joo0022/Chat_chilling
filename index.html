<!DOCTYPE html>
<html lang="ar" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Chat_With_Us 💬 | Telegram-style</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rsbg47X7/8f55b377-3e6f-4bc9-bbc5-9b1ed3057599.png">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root[data-theme="light"] {
      --bg-gradient-start: #eef2f3;
      --bg-gradient-end: #eef2f3;
      --container-bg: #ffffff;
      --auth-side-bg: linear-gradient(135deg, #f0f2f5, #ffffff);
      --auth-main-bg: #ffffff;
      --text-primary: #1f2a3e;
      --text-secondary: #4a5568;
      --text-light: #718096;
      --bg-white: #ffffff;
      --bg-light: #f8f9fc;
      --border-color: #e9eef3;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --message-own: #e4e6eb;
      --message-other: #ffffff;
      --sidebar-bg: #ffffff;
      --input-bg: #f0f2f5;
      --icon-color: #5f6b7a;
      --hover-bg: #f0f2f5;
      --online-status: #31a24c;
      --away-status: #f5a623;
      --offline-status: #a0aec0;
      --danger-color: #e53e3e;
      --success-color: #31a24c;
      --warning-color: #ecc94b;
      --user-color-1: #FF6B6B;
      --user-color-2: #4ECDC4;
      --user-color-3: #45B7D1;
      --user-color-4: #96CEB4;
      --user-color-5: #FFEAA7;
      --user-color-6: #DDA0DD;
      --user-color-7: #98D8C8;
      --user-color-8: #F7DC6F;
      --user-color-9: #BB8FCE;
      --user-color-10: #82E0AA;
      --user-color-11: #F1948A;
      --user-color-12: #85C1E9;
    }

    :root[data-theme="dark"] {
      --bg-gradient-start: #0f1117;
      --bg-gradient-end: #0f1117;
      --container-bg: #1e1f2c;
      --auth-side-bg: linear-gradient(135deg, #1e1f2c, #2a2b38);
      --auth-main-bg: #1e1f2c;
      --text-primary: #e9eef3;
      --text-secondary: #cbd5e0;
      --text-light: #8e9aaf;
      --bg-white: #1e1f2c;
      --bg-light: #2a2b38;
      --border-color: #2d2f3e;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --message-own: #2a2b38;
      --message-other: #2a2b38;
      --sidebar-bg: #1e1f2c;
      --input-bg: #2a2b38;
      --icon-color: #a0b3d9;
      --hover-bg: #35384a;
      --online-status: #2ecc71;
      --away-status: #f1c40f;
      --offline-status: #718096;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
      --warning-color: #f1c40f;
      --user-color-1: #FF8A8A;
      --user-color-2: #6ED4CB;
      --user-color-3: #5FC3E0;
      --user-color-4: #A8D5BA;
      --user-color-5: #FFF2B5;
      --user-color-6: #E6B8E6;
      --user-color-7: #B0E0D6;
      --user-color-8: #FCE96A;
      --user-color-9: #D2B4DE;
      --user-color-10: #A3E4C0;
      --user-color-11: #F5B7B1;
      --user-color-12: #A9D6F0;
    }

    body {
      background: var(--bg-gradient-start);
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Loading screen */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.3s ease;
    }
    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      text-align: center;
      color: white;
    }
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Full-screen container */
    .container {
      width: 100%;
      height: 100vh;
      background: var(--container-bg);
      overflow: hidden;
      position: relative;
    }

    /* ===== AUTH SIMPLIFIED ===== */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient-start);
    }
    .auth-main {
      width: 100%;
      max-width: 460px;
      padding: 20px;
      background: var(--auth-main-bg);
      border-radius: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      margin: 20px;
    }
    .auth-form-container {
      width: 100%;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      background: var(--bg-light);
      padding: 6px;
      border-radius: 60px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 12px rgba(102,126,234,0.25);
    }
    .input-group-modern {
      margin-bottom: 18px;
    }
    .input-group-modern label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input-modern {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .input-modern:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .password-wrapper-modern {
      position: relative;
    }
    .password-toggle-modern {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
    }
    .btn-modern {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 2px 8px rgba(102,126,234,0.3);
    }
    .btn-modern.google {
      background: var(--bg-white);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: none;
    }
    .separator-modern {
      text-align: center;
      margin: 20px 0;
      color: var(--text-light);
      font-size: 0.8rem;
      position: relative;
    }
    .validation-message {
      font-size: 0.75rem;
      margin-top: 5px;
    }
    .username-check {
      font-size: 0.75rem;
      margin-top: 5px;
    }
    .error-message {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }
    .req-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.7rem;
    }
    .req-list div {
      background: var(--bg-light);
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* ===== TELEGRAM-LIKE CHAT ===== */
    #chat {
      height: 100%;
      display: none;
    }
    .chat-container {
      display: flex;
      height: 100%;
      width: 100%;
    }
    /* Users sidebar */
    .users-sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 18px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-header h3 {
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }
    .online-count {
      background: var(--bg-light);
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 0.75rem;
    }
    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-light);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .user-item:hover {
      background: var(--hover-bg);
      border-color: var(--border-color);
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .user-info {
      flex: 1;
    }
    .user-name {
      font-weight: 600;
      color: var(--text-primary);
    }
    .user-status {
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online-status);
    }
    .notification-badge-new {
      background: var(--danger-color);
      color: white;
      border-radius: 30px;
      padding: 2px 8px;
      font-size: 0.7rem;
    }
    /* Main chat area */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-light);
      overflow: hidden;
    }
    .chat-header {
      padding: 12px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .chat-header h2 {
      font-size: 1.2rem;
      color: var(--text-primary);
    }
    .header-actions-new {
      display: flex;
      gap: 12px;
    }
    .btn-icon, .theme-toggle {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: var(--bg-light);
      color: var(--icon-color);
      cursor: pointer;
      transition: 0.2s;
      font-size: 1rem;
    }
    .btn-icon:hover, .theme-toggle:hover {
      background: var(--hover-bg);
      color: #667eea;
    }
    /* Search bar toggle */
    .search-area {
      display: none;
      padding: 12px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .search-area.show {
      display: block;
    }
    .search-input-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      padding: 10px 18px;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.9rem;
    }
    /* Messages area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 20px;
      animation: fadeSlide 0.2s ease;
      position: relative;
    }
    .message-bubble.own {
      align-self: flex-end;
      background: var(--message-own);
      color: var(--text-primary);
      border-radius: 20px 20px 4px 20px;
    }
    .message-bubble.other {
      align-self: flex-start;
      background: var(--message-other);
      color: var(--text-primary);
      border-radius: 20px 20px 20px 4px;
      box-shadow: 0 1px 2px var(--shadow-color);
    }
    .message-sender {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.05);
    }
    .message-text {
      word-break: break-word;
      line-height: 1.4;
    }
    .message-time {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 5px;
      text-align: left;
    }
    .message-image {
      max-width: 220px;
      max-height: 180px;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .reactions-wrapper {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .reaction-badge-new {
      background: rgba(0,0,0,0.05);
      border-radius: 30px;
      padding: 2px 10px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .typing-indicator-new {
      padding: 8px 20px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-light);
      flex-shrink: 0;
    }
    .input-area-new {
      padding: 14px 20px;
      background: var(--bg-white);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .message-input {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
    }
    .message-input:focus {
      outline: none;
    }
    .btn-send, .btn-upload {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--bg-light);
      color: var(--icon-color);
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-send:hover, .btn-upload:hover {
      background: #667eea;
      color: white;
    }
    /* Private chat overlay */
    .private-page-new {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-light);
      z-index: 2000;
      display: none;
      flex-direction: column;
    }
    .private-page-new.show {
      display: flex;
    }
    .private-header-new {
      padding: 14px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .private-messages-new {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    /* Modals */
    .image-preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .image-preview-modal.show {
      display: flex;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .users-sidebar {
        position: absolute;
        top: 0;
        right: -100%;
        width: 280px;
        z-index: 1000;
        transition: 0.2s;
      }
      .users-sidebar.show {
        right: 0;
      }
      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
<div id="loadingScreen">
  <div class="loader-content"><div class="loader-spinner"></div><p>جاري التحميل...</p></div>
</div>
<div class="container">
  <!-- Auth simplified -->
  <div id="auth">
    <div class="auth-main">
      <div class="auth-form-container">
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab" onclick="switchAuthTab('login')">تسجيل الدخول</button>
          <button class="auth-tab" id="registerTab" onclick="switchAuthTab('register')">حساب جديد</button>
        </div>
        <div id="loginForm">
          <div class="input-group-modern"><label>📧 البريد الإلكتروني</label><input type="email" id="loginEmail" class="input-modern" placeholder="example@domain.com"><div id="loginEmailValidation" class="validation-message"></div></div>
          <div class="input-group-modern"><label>🔒 كلمة المرور</label><div class="password-wrapper-modern"><input type="password" id="loginPassword" class="input-modern"><button class="password-toggle-modern" onclick="togglePasswordVisibility('loginPassword', this)" type="button"><i class="far fa-eye"></i></button></div></div>
          <div id="loginError" class="error-message" style="display:none;"></div>
          <button class="btn-modern" onclick="login()">تسجيل الدخول</button>
          <div style="text-align:center; margin-top:12px;"><button onclick="showForgotPasswordModal()" style="background:none; border:none; color:#667eea; cursor:pointer; font-size:0.8rem;">نسيت كلمة المرور؟</button></div>
        </div>
        <div id="registerForm" style="display:none;">
          <div class="input-group-modern"><label>👤 اسم المستخدم (حد أقصى 15)</label><input type="text" id="username" maxlength="15" class="input-modern" oninput="checkUsernameAvailability()"><div id="usernameCheck" class="username-check"></div></div>
          <div class="input-group-modern"><label>📧 البريد الإلكتروني</label><input type="email" id="email" class="input-modern" oninput="validateEmail()"><div id="emailValidation" class="validation-message"></div></div>
          <div class="input-group-modern"><label>🔒 كلمة المرور</label><div class="password-wrapper-modern"><input type="password" id="password" class="input-modern" oninput="validatePassword()"><button class="password-toggle-modern" onclick="togglePasswordVisibility('password', this)" type="button"><i class="far fa-eye"></i></button></div></div>
          <div class="req-list" id="passwordReqs"></div>
          <div id="registerError" class="error-message" style="display:none;"></div>
          <button class="btn-modern" onclick="register()">إنشاء حساب</button>
        </div>
        <div class="separator-modern">أو</div>
        <button class="btn-modern google" onclick="googleLogin()"><i class="fab fa-google"></i> Google</button>
      </div>
    </div>
  </div>
  <!-- Chat area -->
  <div id="chat">
    <div class="chat-container">
      <div class="users-sidebar">
        <div class="sidebar-header"><h3><i class="fas fa-users"></i> المستخدمون <span class="online-count" id="onlineCount">0</span></h3></div>
        <div class="users-list" id="onlineList"></div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <h2><i class="fas fa-comment-dots"></i> المحادثة العامة</h2>
          <div class="header-actions-new">
            <button class="btn-icon" id="searchToggleBtn" onclick="toggleSearchBar()"><i class="fas fa-search"></i></button>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-sun sun-icon"></i><i class="fas fa-moon moon-icon"></i></button>
            <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-users"></i></button>
            <button class="btn-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
          </div>
        </div>
        <!-- Search bar (hidden by default) -->
        <div class="search-area" id="searchBar">
          <div class="search-input-group">
            <input type="text" id="searchInput" placeholder="ابحث في الرسائل..." class="search-input" oninput="searchMessages(this.value)">
            <button class="btn-close" onclick="closeSearchBar()">إلغاء</button>
          </div>
        </div>
        <div id="typingIndicator" class="typing-indicator-new" style="display:none;"><div class="typing-dots"><span></span><span></span><span></span></div><span id="typingText"></span></div>
        <div id="replyIndicator" class="typing-indicator-new" style="display:none;"><i class="fas fa-reply"></i><span>الرد على <span id="replyToName"></span> : "<span id="replyText"></span>"</span><button onclick="cancelReply()" style="background:none; border:none; color:var(--danger-color);"><i class="fas fa-times"></i></button></div>
        <div class="messages-area" id="messages"></div>
        <div class="input-area-new">
          <button class="btn-upload" onclick="document.getElementById('imageFileInput').click()"><i class="fas fa-image"></i></button>
          <input type="text" id="messageInput" placeholder="اكتب رسالة..." class="message-input" oninput="handleTyping()">
          <button class="btn-send" onclick="sendWithReply()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Private Chat Modal -->
<div class="private-page-new" id="privatePage">
  <div class="private-header-new"><button onclick="closePrivateChat()"><i class="fas fa-arrow-right"></i></button><h3>محادثة مع: <span id="privatePartnerName"></span></h3><span id="privateStatus"></span><button class="theme-toggle" style="margin-right: auto;" onclick="toggleTheme()"><i class="fas fa-sun sun-icon"></i><i class="fas fa-moon moon-icon"></i></button></div>
  <div id="privateTypingIndicator" class="typing-indicator-new" style="display:none;"><span id="privateTypingText"></span></div>
  <div class="private-messages-new" id="privateMessages"></div>
  <div class="input-area-new"><button class="btn-upload" onclick="document.getElementById('imageFileInput').click()"><i class="fas fa-image"></i></button><input type="text" id="privateInput" placeholder="رسالة خاصة..." class="message-input" oninput="handlePrivateTyping()"><button class="btn-send" onclick="sendPrivateMessage()"><i class="fas fa-paper-plane"></i></button></div>
</div>
<!-- Image modals -->
<div class="image-preview-modal" id="fullImageModal"><button class="close-preview" onclick="document.getElementById('fullImageModal').classList.remove('show')" style="position:absolute; top:20px; right:20px; background:#fff; border:none; width:40px; height:40px; border-radius:50%;"><i class="fas fa-times"></i></button><div class="preview-content-new"><img id="fullImage" src=""></div></div>
<div class="image-preview-modal" id="imagePreviewContainer"><div style="background:var(--bg-white); border-radius:28px; padding:24px;"><img id="imagePreview" style="max-width:280px; max-height:280px; border-radius:16px;"><div style="display:flex; gap:12px; margin-top:20px;"><button class="btn-modern" onclick="sendImageMessage()" style="padding:8px 24px;">إرسال</button><button class="btn-modern google" onclick="cancelImageUpload()">إلغاء</button></div></div></div>
<div class="image-preview-modal" id="uploadProgress"><div style="background:var(--bg-white); padding:30px; border-radius:28px; text-align:center;"><div style="width:40px; height:40px; border:3px solid #ccc; border-top-color:#667eea; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div><p>جاري الرفع...</p></div></div>
<div class="image-preview-modal" id="forgotPasswordModal"><div style="background:var(--bg-white); border-radius:28px; padding:28px; max-width:360px;"><h3>استعادة كلمة المرور</h3><input type="email" id="resetEmail" class="input-modern" placeholder="البريد الإلكتروني"><div id="resetEmailValidation"></div><div id="forgotPasswordMessage"></div><div style="display:flex; gap:12px; margin-top:20px;"><button class="btn-modern" onclick="sendPasswordReset()">إرسال</button><button class="btn-modern google" onclick="hideForgotPasswordModal()">إلغاء</button></div></div></div>
<input type="file" id="imageFileInput" accept="image/*" style="display:none;">

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyANJjbTOFTKUAuT-g1BKY7LU9a4OabSEDQ",
    authDomain: "enhanced-app-492f6.firebaseapp.com",
    projectId: "enhanced-app-492f6",
    storageBucket: "enhanced-app-492f6.firebasestorage.app",
    messagingSenderId: "544947944105",
    appId: "1:544947944105:web:f2ac32d485c8ad68b647b8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const googleProvider = new firebase.auth.GoogleAuthProvider();
  const CLOUD_NAME = "dn0knjzpi";
  const UPLOAD_PRESET = "chat-app";

  // Global state
  let currentUser = null;
  let currentUsername = '';
  let activePartner = null;
  let replyingTo = null;
  let selectedImageFile = null;
  let currentImageMessageContext = null;
  let unsubscribePublic = null;
  let unsubscribeOnline = null;
  let unsubscribePrivate = null;
  let unsubscribePartner = null;
  let typingTimeout = null;
  let isTyping = false;
  let activityTimeout = null;
  let isAway = false;

  // DOM elements
  const loadingScreen = document.getElementById('loadingScreen');
  const messagesDiv = document.getElementById('messages');
  const messageInput = document.getElementById('messageInput');
  const privateMessages = document.getElementById('privateMessages');
  const privateInput = document.getElementById('privateInput');

  // Helper functions
  function hideLoadingScreen() { loadingScreen.classList.add('hidden'); }
  function showToast(msg) { let t = document.createElement('div'); t.textContent = msg; t.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2c3e50; color:white; padding:10px 24px; border-radius:40px; z-index:10000; font-size:0.85rem;"; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
  function escapeHtml(s) { return String(s).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  function scrollToBottom(el) { if(el) el.scrollTop = el.scrollHeight; }

  // ========== ADVANCED PRESENCE SYSTEM ==========
  async function setupUserPresence() {
    if (!currentUser) return;
    const userRef = db.collection('users').doc(currentUser.uid);
    const userStatusRef = db.collection('status').doc(currentUser.uid);
    await userRef.update({ online: true, status: 'online', lastSeen: firebase.firestore.FieldValue.serverTimestamp(), lastActive: firebase.firestore.FieldValue.serverTimestamp() });
    userRef.onDisconnect().update({ online: false, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    userStatusRef.onDisconnect().set({ uid: currentUser.uid, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    window.addEventListener('online', () => userRef.update({ online: true, status: 'online', lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{}));
    window.addEventListener('offline', () => userRef.update({ online: false, status: 'offline' }).catch(()=>{}));
    window.addEventListener('beforeunload', () => userRef.update({ online: false, status: 'offline' }).catch(()=>{}));
  }

  function setupActivityMonitor() {
    if (!currentUser) return;
    const userRef = db.collection('users').doc(currentUser.uid);
    let lastActivity = Date.now();
    function updateLastActivity() {
      lastActivity = Date.now();
      if (isAway) {
        isAway = false;
        userRef.update({ status: 'online', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
      }
      clearTimeout(activityTimeout);
      activityTimeout = setTimeout(() => {
        if (document.visibilityState === 'hidden' || (Date.now() - lastActivity > 30000)) {
          isAway = true;
          userRef.update({ status: 'away', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
        }
      }, 30000);
    }
    ['mousedown','keydown','touchstart','mousemove','scroll'].forEach(ev => document.addEventListener(ev, updateLastActivity, { passive: true }));
    document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(activityTimeout); isAway = true; userRef.update({ status: 'away', online: true }).catch(()=>{}); } else updateLastActivity(); });
    updateLastActivity();
  }

  // ========== AUTH FUNCTIONS ==========
  window.switchAuthTab = (tab) => {
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  };
  window.togglePasswordVisibility = (id, btn) => {
    let inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.querySelector('i').className = 'far fa-eye-slash'; }
    else { inp.type = 'password'; btn.querySelector('i').className = 'far fa-eye'; }
  };
  window.validateEmail = () => { /* keep same */ };
  window.validatePassword = () => { /* keep same */ };
  window.checkUsernameAvailability = async () => { /* keep same */ };
  window.login = async () => { /* keep same */ };
  window.register = async () => { /* keep same */ };
  window.googleLogin = async () => { try { await auth.signInWithPopup(googleProvider); } catch(e){ showToast('فشل تسجيل Google'); } };
  window.logout = async () => { if(currentUser) await db.collection('users').doc(currentUser.uid).update({ online: false, status: 'offline' }); await auth.signOut(); };

  // ========== CHAT CORE ==========
  function loadPublicMessages() {
    if (unsubscribePublic) unsubscribePublic();
    unsubscribePublic = db.collection('messages').orderBy('createdAt', 'asc').limit(50).onSnapshot(snap => {
      messagesDiv.innerHTML = '';
      snap.forEach(doc => {
        let msg = doc.data();
        if (!msg.text && !msg.imageUrl) return;
        let div = document.createElement('div');
        div.className = `message-bubble ${msg.uid === currentUser?.uid ? 'own' : 'other'}`;
        let time = msg.createdAt?.toDate ? `${msg.createdAt.toDate().getHours()}:${msg.createdAt.toDate().getMinutes().toString().padStart(2,'0')}` : '';
        let content = '';
        if (msg.uid !== currentUser?.uid) content += `<div class="message-sender">${escapeHtml(msg.username)}</div>`;
        if (msg.replyTo) content += `<div style="font-size:0.7rem; opacity:0.7;">↩ ${escapeHtml(msg.replyTo.username)}: ${escapeHtml(msg.replyTo.text.substring(0,30))}</div>`;
        if (msg.text) content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
        if (msg.imageUrl) content += `<img src="${escapeHtml(msg.imageUrl)}" class="message-image" onclick="showFullImage('${escapeHtml(msg.imageUrl)}')">`;
        content += `<div class="message-time">${time}</div>`;
        div.innerHTML = content;
        messagesDiv.appendChild(div);
      });
      scrollToBottom(messagesDiv);
    });
  }

  function loadOnlineUsers() {
    if (unsubscribeOnline) unsubscribeOnline();
    unsubscribeOnline = db.collection('users').where('uid', '!=', currentUser?.uid).onSnapshot(snap => {
      let html = '', onlineCount = 0, awayCount = 0;
      snap.forEach(doc => {
        if (doc.id === currentUser?.uid) return;
        let data = doc.data();
        if (!data.username) return;
        let initial = data.username.charAt(0).toUpperCase();
        let statusText = '', statusClass = '', dot = '';
        if (data.online === true) {
          if (data.status === 'online') { onlineCount++; statusText = '🟢 متصل'; statusClass = 'online'; dot = '<span class="status-dot"></span>'; }
          else if (data.status === 'away') { awayCount++; statusText = '🟡 غير نشط'; statusClass = 'away'; dot = '<span class="status-dot away"></span>'; }
          else { onlineCount++; statusText = '🟢 متصل'; statusClass = 'online'; dot = '<span class="status-dot"></span>'; }
        } else { statusText = '🔴 غير متصل'; statusClass = 'offline'; dot = '<span class="status-dot offline"></span>'; }
        html += `<div class="user-item" onclick="openPrivateChat('${doc.id}','${escapeHtml(data.username)}')"><div class="user-avatar">${initial}</div><div class="user-info"><div class="user-name">${escapeHtml(data.username)}</div><div class="user-status ${statusClass}">${dot} ${statusText}</div></div></div>`;
      });
      document.getElementById('onlineList').innerHTML = html || '<div class="no-messages">لا يوجد مستخدمين</div>';
      document.getElementById('onlineCount').innerHTML = `${onlineCount} متصل، ${awayCount} غير نشط`;
    });
  }

  function loadTypingIndicators() {
    db.collection('typing').onSnapshot(snap => {
      let typingUsers = [];
      snap.forEach(doc => { if (doc.id !== currentUser?.uid && doc.data().isTyping) typingUsers.push(doc.data().username); });
      if (typingUsers.length) { document.getElementById('typingText').innerText = typingUsers.join('، ') + ' يكتب...'; document.getElementById('typingIndicator').style.display = 'flex'; }
      else document.getElementById('typingIndicator').style.display = 'none';
    });
  }

  window.openPrivateChat = (uid, username) => {
    activePartner = { uid, username };
    document.getElementById('privatePartnerName').innerText = username;
    document.getElementById('privatePage').classList.add('show');
    let roomId = [currentUser.uid, uid].sort().join('_');
    if (unsubscribePrivate) unsubscribePrivate();
    unsubscribePrivate = db.collection('private_messages').where('roomId', '==', roomId).orderBy('createdAt').onSnapshot(snap => {
      privateMessages.innerHTML = '';
      snap.forEach(d => {
        let m = d.data();
        let t = m.createdAt?.toDate ? `${m.createdAt.toDate().getHours()}:${m.createdAt.toDate().getMinutes().toString().padStart(2,'0')}` : '';
        let div = document.createElement('div');
        div.className = `message-bubble ${m.uid === currentUser.uid ? 'own' : 'other'}`;
        div.innerHTML = (m.uid !== currentUser.uid ? `<div class="message-sender">${escapeHtml(m.username)}</div>` : '') + (m.text ? `<div class="message-text">${escapeHtml(m.text)}</div>` : '') + (m.imageUrl ? `<img src="${escapeHtml(m.imageUrl)}" class="message-image" onclick="showFullImage('${escapeHtml(m.imageUrl)}')">` : '') + `<div class="message-time">${t}</div>`;
        privateMessages.appendChild(div);
      });
      scrollToBottom(privateMessages);
    });
    if (unsubscribePartner) unsubscribePartner();
    unsubscribePartner = db.collection('users').doc(uid).onSnapshot(doc => {
      if (doc.exists) {
        let d = doc.data();
        if (d.online && d.status === 'online') document.getElementById('privateStatus').innerHTML = '🟢 متصل';
        else if (d.online && d.status === 'away') document.getElementById('privateStatus').innerHTML = '🟡 غير نشط';
        else document.getElementById('privateStatus').innerHTML = '🔴 غير متصل';
      }
    });
  };
  window.closePrivateChat = () => { if (unsubscribePrivate) unsubscribePrivate(); if (unsubscribePartner) unsubscribePartner(); activePartner = null; document.getElementById('privatePage').classList.remove('show'); };
  window.sendPrivateMessage = () => { let txt = privateInput.value.trim(); if (!txt || !activePartner) return; let roomId = [currentUser.uid, activePartner.uid].sort().join('_'); db.collection('private_messages').add({ text: txt, username: currentUsername, uid: currentUser.uid, toUid: activePartner.uid, roomId, createdAt: new Date() }); privateInput.value = ''; scrollToBottom(privateMessages); };
  function sendWithReply() { let txt = messageInput.value.trim(); if (!txt) return; let data = { text: txt, username: currentUsername, uid: currentUser.uid, createdAt: new Date() }; if (replyingTo) data.replyTo = replyingTo; db.collection('messages').add(data); messageInput.value = ''; cancelReply(); scrollToBottom(messagesDiv); }
  function handleTyping() { if (!currentUser) return; if (!isTyping) { isTyping = true; db.collection('typing').doc(currentUser.uid).set({ username: currentUsername, isTyping: true, timestamp: new Date() }); } clearTimeout(typingTimeout); typingTimeout = setTimeout(() => { isTyping = false; db.collection('typing').doc(currentUser.uid).delete(); }, 2000); }
  function handlePrivateTyping() { if (!currentUser || !activePartner) return; let roomId = [currentUser.uid, activePartner.uid].sort().join('_'); if (!isTyping) { isTyping = true; db.collection('private_typing').doc(roomId).set({ username: currentUsername, isTyping: true }); } clearTimeout(typingTimeout); typingTimeout = setTimeout(() => { isTyping = false; db.collection('private_typing').doc(roomId).delete(); }, 2000); }
  window.toggleSearchBar = () => { document.getElementById('searchBar').classList.toggle('show'); if (document.getElementById('searchBar').classList.contains('show')) document.getElementById('searchInput').focus(); };
  window.closeSearchBar = () => { document.getElementById('searchBar').classList.remove('show'); clearSearch(); };
  window.searchMessages = (term) => { if (!term.trim()) return; document.querySelectorAll('.message-bubble').forEach(el => { if (el.innerText.toLowerCase().includes(term.toLowerCase())) { el.style.backgroundColor = '#fffaec'; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else el.style.backgroundColor = ''; }); };
  window.clearSearch = () => { document.getElementById('searchInput').value = ''; document.querySelectorAll('.message-bubble').forEach(el => el.style.backgroundColor = ''); };
  window.showFullImage = (url) => { document.getElementById('fullImage').src = url; document.getElementById('fullImageModal').classList.add('show'); };
  window.toggleSidebar = () => document.querySelector('.users-sidebar').classList.toggle('show');
  window.toggleTheme = () => { let html = document.documentElement; let cur = html.getAttribute('data-theme') || 'light'; html.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light'); localStorage.setItem('chat-theme', cur === 'light' ? 'dark' : 'light'); };
  window.setReply = (id, text, username) => { replyingTo = { id, text, username }; document.getElementById('replyToName').innerText = username; document.getElementById('replyText').innerText = text.substring(0, 40); document.getElementById('replyIndicator').style.display = 'flex'; };
  window.cancelReply = () => { replyingTo = null; document.getElementById('replyIndicator').style.display = 'none'; };
  document.getElementById('imageFileInput').addEventListener('change', (e) => { let f = e.target.files[0]; if (!f) return; if (f.size > 5 * 1024 * 1024) { showToast('الصورة كبيرة'); return; } selectedImageFile = f; let reader = new FileReader(); reader.onload = ev => { document.getElementById('imagePreview').src = ev.target.result; document.getElementById('imagePreviewContainer').classList.add('show'); currentImageMessageContext = document.getElementById('privatePage').classList.contains('show') ? 'private' : 'public'; }; reader.readAsDataURL(f); });
  window.sendImageMessage = async () => { if (!selectedImageFile) return; document.getElementById('uploadProgress').classList.add('show'); let fd = new FormData(); fd.append('file', selectedImageFile); fd.append('upload_preset', UPLOAD_PRESET); let res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd }); let data = await res.json(); if (currentImageMessageContext === 'private' && activePartner) { let roomId = [currentUser.uid, activePartner.uid].sort().join('_'); await db.collection('private_messages').add({ imageUrl: data.secure_url, username: currentUsername, uid: currentUser.uid, toUid: activePartner.uid, roomId, createdAt: new Date() }); } else { await db.collection('messages').add({ imageUrl: data.secure_url, username: currentUsername, uid: currentUser.uid, createdAt: new Date() }); } showToast('✅ تم إرسال الصورة'); document.getElementById('uploadProgress').classList.remove('show'); cancelImageUpload(); };
  window.cancelImageUpload = () => { selectedImageFile = null; document.getElementById('imagePreviewContainer').classList.remove('show'); document.getElementById('imageFileInput').value = ''; };
  window.showForgotPasswordModal = () => document.getElementById('forgotPasswordModal').classList.add('show');
  window.hideForgotPasswordModal = () => document.getElementById('forgotPasswordModal').classList.remove('show');
  window.sendPasswordReset = async () => { let email = document.getElementById('resetEmail').value.trim(); if (!email) return; try { await auth.sendPasswordResetEmail(email); showToast('رابط إعادة التعيين أرسل'); hideForgotPasswordModal(); } catch(e){ showToast('خطأ: '+e.message); } };

  // Auth state
  auth.onAuthStateChanged(async (user) => {
    if (user && user.emailVerified) {
      currentUser = user;
      let doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) currentUsername = doc.data().username;
      else currentUsername = user.email.split('@')[0];
      await db.collection('users').doc(user.uid).set({ username: currentUsername, email: user.email, online: true, status: 'online', lastActive: new Date() }, { merge: true });
      await setupUserPresence();
      setupActivityMonitor();
      loadPublicMessages();
      loadOnlineUsers();
      loadTypingIndicators();
      document.getElementById('auth').style.display = 'none';
      document.getElementById('chat').style.display = 'block';
      hideLoadingScreen();
    } else {
      document.getElementById('auth').style.display = 'flex';
      document.getElementById('chat').style.display = 'none';
      if (user && !user.emailVerified) showToast('⚠️ يرجى تفعيل البريد الإلكتروني أولاً');
      hideLoadingScreen();
    }
  });
  messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendWithReply(); });
  privateInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendPrivateMessage(); });
  (function loadTheme() { let saved = localStorage.getItem('chat-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
  setTimeout(() => hideLoadingScreen(), 2000);
</script>
</body>
</html>
