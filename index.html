<!DOCTYPE html>
<html lang="ar" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Chat_With_Us 💬 | Telegram-style</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rsbg47X7/8f55b377-3e6f-4bc9-bbc5-9b1ed3057599.png">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root[data-theme="light"] {
      --bg-gradient-start: #eef2f3;
      --bg-gradient-end: #eef2f3;
      --container-bg: #ffffff;
      --auth-main-bg: #ffffff;
      --text-primary: #1f2a3e;
      --text-secondary: #4a5568;
      --text-light: #718096;
      --bg-white: #ffffff;
      --bg-light: #f8f9fc;
      --border-color: #e9eef3;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --message-own: #e4e6eb;
      --message-other: #ffffff;
      --sidebar-bg: #ffffff;
      --input-bg: #f0f2f5;
      --icon-color: #5f6b7a;
      --hover-bg: #f0f2f5;
      --online-status: #31a24c;
      --away-status: #f5a623;
      --offline-status: #a0aec0;
      --danger-color: #e53e3e;
      --success-color: #31a24c;
      --warning-color: #ecc94b;
    }

    :root[data-theme="dark"] {
      --bg-gradient-start: #0f1117;
      --bg-gradient-end: #0f1117;
      --container-bg: #1e1f2c;
      --auth-main-bg: #1e1f2c;
      --text-primary: #e9eef3;
      --text-secondary: #cbd5e0;
      --text-light: #8e9aaf;
      --bg-white: #1e1f2c;
      --bg-light: #2a2b38;
      --border-color: #2d2f3e;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --message-own: #2a2b38;
      --message-other: #2a2b38;
      --sidebar-bg: #1e1f2c;
      --input-bg: #2a2b38;
      --icon-color: #a0b3d9;
      --hover-bg: #35384a;
      --online-status: #2ecc71;
      --away-status: #f1c40f;
      --offline-status: #718096;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
      --warning-color: #f1c40f;
    }

    body {
      background: var(--bg-gradient-start);
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.3s ease;
    }
    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      text-align: center;
      color: white;
    }
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .container {
      width: 100%;
      height: 100vh;
      background: var(--container-bg);
      overflow: hidden;
    }

    /* Auth */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient-start);
    }
    .auth-main {
      width: 100%;
      max-width: 460px;
      padding: 20px;
      background: var(--auth-main-bg);
      border-radius: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      margin: 20px;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      background: var(--bg-light);
      padding: 6px;
      border-radius: 60px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 12px rgba(102,126,234,0.25);
    }
    .input-group-modern {
      margin-bottom: 18px;
    }
    .input-group-modern label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input-modern {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .input-modern:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .password-wrapper-modern {
      position: relative;
    }
    .password-toggle-modern {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
    }
    .btn-modern {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 2px 8px rgba(102,126,234,0.3);
    }
    .btn-modern.google {
      background: var(--bg-white);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: none;
    }
    .separator-modern {
      text-align: center;
      margin: 20px 0;
      color: var(--text-light);
      font-size: 0.8rem;
      position: relative;
    }
    .validation-message {
      font-size: 0.75rem;
      margin-top: 5px;
    }
    .username-check {
      font-size: 0.75rem;
      margin-top: 5px;
    }
    .error-message {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }
    .req-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.7rem;
    }
    .req-list div {
      background: var(--bg-light);
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* Chat layout */
    #chat {
      height: 100%;
      display: none;
    }
    .chat-container {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .users-sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 18px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-header h3 {
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }
    .online-count {
      background: var(--bg-light);
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 0.75rem;
    }
    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-light);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .user-item:hover {
      background: var(--hover-bg);
      border-color: var(--border-color);
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .user-info {
      flex: 1;
    }
    .user-name {
      font-weight: 600;
      color: var(--text-primary);
    }
    .user-status {
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online-status);
    }
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-light);
      overflow: hidden;
    }
    .chat-header {
      padding: 12px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .chat-header h2 {
      font-size: 1.2rem;
      color: var(--text-primary);
    }
    .header-actions-new {
      display: flex;
      gap: 12px;
    }
    .btn-icon, .theme-toggle {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: var(--bg-light);
      color: var(--icon-color);
      cursor: pointer;
      transition: 0.2s;
      font-size: 1rem;
    }
    .btn-icon:hover, .theme-toggle:hover {
      background: var(--hover-bg);
      color: #667eea;
    }
    .search-area {
      display: none;
      padding: 12px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .search-area.show {
      display: block;
    }
    .search-input-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      padding: 10px 18px;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 20px;
      animation: fadeSlide 0.2s ease;
    }
    .message-bubble.own {
      align-self: flex-end;
      background: var(--message-own);
      color: var(--text-primary);
      border-radius: 20px 20px 4px 20px;
    }
    .message-bubble.other {
      align-self: flex-start;
      background: var(--message-other);
      color: var(--text-primary);
      border-radius: 20px 20px 20px 4px;
      box-shadow: 0 1px 2px var(--shadow-color);
    }
    .message-sender {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.05);
    }
    .message-text {
      word-break: break-word;
      line-height: 1.4;
    }
    .message-time {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 5px;
      text-align: left;
    }
    .message-image {
      max-width: 220px;
      max-height: 180px;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .typing-indicator-new {
      padding: 8px 20px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-light);
      flex-shrink: 0;
    }
    .input-area-new {
      padding: 14px 20px;
      background: var(--bg-white);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .message-input {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
    }
    .message-input:focus {
      outline: none;
    }
    .btn-send, .btn-upload {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--bg-light);
      color: var(--icon-color);
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-send:hover, .btn-upload:hover {
      background: #667eea;
      color: white;
    }
    .private-page-new {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-light);
      z-index: 2000;
      display: none;
      flex-direction: column;
    }
    .private-page-new.show {
      display: flex;
    }
    .private-header-new {
      padding: 14px 20px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .private-messages-new {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .image-preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .image-preview-modal.show {
      display: flex;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .users-sidebar {
        position: absolute;
        top: 0;
        right: -100%;
        width: 280px;
        z-index: 1000;
        transition: 0.2s;
      }
      .users-sidebar.show {
        right: 0;
      }
      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
<div id="loadingScreen">
  <div class="loader-content"><div class="loader-spinner"></div><p>جاري التحميل...</p></div>
</div>
<div class="container">
  <div id="auth">
    <div class="auth-main">
      <div class="auth-form-container">
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab" onclick="switchAuthTab('login')">تسجيل الدخول</button>
          <button class="auth-tab" id="registerTab" onclick="switchAuthTab('register')">حساب جديد</button>
        </div>
        <div id="loginForm">
          <div class="input-group-modern"><label>📧 البريد الإلكتروني</label><input type="email" id="loginEmail" class="input-modern" placeholder="example@domain.com" oninput="validateLoginEmail()"><div id="loginEmailValidation" class="validation-message"></div></div>
          <div class="input-group-modern"><label>🔒 كلمة المرور</label><div class="password-wrapper-modern"><input type="password" id="loginPassword" class="input-modern"><button class="password-toggle-modern" onclick="togglePasswordVisibility('loginPassword', this)" type="button"><i class="far fa-eye"></i></button></div></div>
          <div id="loginError" class="error-message" style="display:none;"></div>
          <button class="btn-modern" onclick="login()">تسجيل الدخول</button>
          <div style="text-align:center; margin-top:12px;"><button onclick="showForgotPasswordModal()" style="background:none; border:none; color:#667eea; cursor:pointer; font-size:0.8rem;">نسيت كلمة المرور؟</button></div>
        </div>
        <div id="registerForm" style="display:none;">
          <div class="input-group-modern"><label>👤 اسم المستخدم (حد أقصى 15)</label><input type="text" id="username" maxlength="15" class="input-modern" oninput="checkUsernameAvailability()"><div id="usernameCheck" class="username-check"></div></div>
          <div class="input-group-modern"><label>📧 البريد الإلكتروني</label><input type="email" id="email" class="input-modern" oninput="validateEmail()"><div id="emailValidation" class="validation-message"></div></div>
          <div class="input-group-modern"><label>🔒 كلمة المرور</label><div class="password-wrapper-modern"><input type="password" id="password" class="input-modern" oninput="validatePassword()"><button class="password-toggle-modern" onclick="togglePasswordVisibility('password', this)" type="button"><i class="far fa-eye"></i></button></div></div>
          <div class="req-list" id="passwordReqs"></div>
          <div id="registerError" class="error-message" style="display:none;"></div>
          <button class="btn-modern" onclick="register()">إنشاء حساب</button>
        </div>
        <div class="separator-modern">أو</div>
        <button class="btn-modern google" onclick="googleLogin()"><i class="fab fa-google"></i> Google</button>
      </div>
    </div>
  </div>
  <div id="chat">
    <div class="chat-container">
      <div class="users-sidebar">
        <div class="sidebar-header"><h3><i class="fas fa-users"></i> المستخدمون <span class="online-count" id="onlineCount">0</span></h3></div>
        <div class="users-list" id="onlineList"></div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <h2><i class="fas fa-comment-dots"></i> المحادثة العامة</h2>
          <div class="header-actions-new">
            <button class="btn-icon" id="searchToggleBtn" onclick="toggleSearchBar()"><i class="fas fa-search"></i></button>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-sun sun-icon"></i><i class="fas fa-moon moon-icon"></i></button>
            <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-users"></i></button>
            <button class="btn-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
          </div>
        </div>
        <div class="search-area" id="searchBar">
          <div class="search-input-group">
            <input type="text" id="searchInput" placeholder="ابحث في الرسائل..." class="search-input" oninput="searchMessages(this.value)">
            <button class="btn-close" onclick="closeSearchBar()">إلغاء</button>
          </div>
        </div>
        <div id="typingIndicator" class="typing-indicator-new" style="display:none;"><span id="typingText"></span> يكتب...</div>
        <div id="replyIndicator" class="typing-indicator-new" style="display:none;"><i class="fas fa-reply"></i><span>الرد على <span id="replyToName"></span> : "<span id="replyText"></span>"</span><button onclick="cancelReply()" style="background:none; border:none; color:var(--danger-color);"><i class="fas fa-times"></i></button></div>
        <div class="messages-area" id="messages"></div>
        <div class="input-area-new">
          <button class="btn-upload" onclick="document.getElementById('imageFileInput').click()"><i class="fas fa-image"></i></button>
          <input type="text" id="messageInput" placeholder="اكتب رسالة..." class="message-input" oninput="handleTyping()">
          <button class="btn-send" onclick="sendWithReply()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="private-page-new" id="privatePage">
  <div class="private-header-new"><button onclick="closePrivateChat()"><i class="fas fa-arrow-right"></i></button><h3>محادثة مع: <span id="privatePartnerName"></span></h3><span id="privateStatus"></span><button class="theme-toggle" style="margin-right: auto;" onclick="toggleTheme()"><i class="fas fa-sun sun-icon"></i><i class="fas fa-moon moon-icon"></i></button></div>
  <div id="privateTypingIndicator" class="typing-indicator-new" style="display:none;"><span id="privateTypingText"></span> يكتب...</div>
  <div class="private-messages-new" id="privateMessages"></div>
  <div class="input-area-new"><button class="btn-upload" onclick="document.getElementById('imageFileInput').click()"><i class="fas fa-image"></i></button><input type="text" id="privateInput" placeholder="رسالة خاصة..." class="message-input" oninput="handlePrivateTyping()"><button class="btn-send" onclick="sendPrivateMessage()"><i class="fas fa-paper-plane"></i></button></div>
</div>
<div class="image-preview-modal" id="fullImageModal"><button class="close-preview" onclick="document.getElementById('fullImageModal').classList.remove('show')" style="position:absolute; top:20px; right:20px; background:#fff; border:none; width:40px; height:40px; border-radius:50%;"><i class="fas fa-times"></i></button><div class="preview-content-new"><img id="fullImage" src=""></div></div>
<div class="image-preview-modal" id="imagePreviewContainer"><div style="background:var(--bg-white); border-radius:28px; padding:24px;"><img id="imagePreview" style="max-width:280px; max-height:280px; border-radius:16px;"><div style="display:flex; gap:12px; margin-top:20px;"><button class="btn-modern" onclick="sendImageMessage()" style="padding:8px 24px;">إرسال</button><button class="btn-modern google" onclick="cancelImageUpload()">إلغاء</button></div></div></div>
<div class="image-preview-modal" id="uploadProgress"><div style="background:var(--bg-white); padding:30px; border-radius:28px; text-align:center;"><div style="width:40px; height:40px; border:3px solid #ccc; border-top-color:#667eea; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div><p>جاري الرفع...</p></div></div>
<div class="image-preview-modal" id="forgotPasswordModal"><div style="background:var(--bg-white); border-radius:28px; padding:28px; max-width:360px;"><h3>استعادة كلمة المرور</h3><input type="email" id="resetEmail" class="input-modern" placeholder="البريد الإلكتروني" oninput="validateResetEmail()"><div id="resetEmailValidation" class="validation-message"></div><div id="forgotPasswordMessage"></div><div style="display:flex; gap:12px; margin-top:20px;"><button class="btn-modern" onclick="sendPasswordReset()">إرسال</button><button class="btn-modern google" onclick="hideForgotPasswordModal()">إلغاء</button></div></div></div>
<input type="file" id="imageFileInput" accept="image/*" style="display:none;">

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyANJjbTOFTKUAuT-g1BKY7LU9a4OabSEDQ",
    authDomain: "enhanced-app-492f6.firebaseapp.com",
    projectId: "enhanced-app-492f6",
    storageBucket: "enhanced-app-492f6.firebasestorage.app",
    messagingSenderId: "544947944105",
    appId: "1:544947944105:web:f2ac32d485c8ad68b647b8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const googleProvider = new firebase.auth.GoogleAuthProvider();
  const CLOUD_NAME = "dn0knjzpi";
  const UPLOAD_PRESET = "chat-app";

  // Global state
  let currentUser = null;
  let currentUsername = '';
  let activePartner = null;
  let replyingTo = null;
  let selectedImageFile = null;
  let currentImageMessageContext = null;
  let unsubscribePublic = null;
  let unsubscribeOnline = null;
  let unsubscribePrivate = null;
  let unsubscribePartner = null;
  let typingTimeout = null;
  let isTyping = false;
  let activityTimeout = null;
  let isAway = false;

  // Helper functions
  function hideLoadingScreen() { document.getElementById('loadingScreen').classList.add('hidden'); }
  function showToast(msg) {
    let t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2c3e50; color:white; padding:10px 24px; border-radius:40px; z-index:10000; font-size:0.85rem;";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }
  function escapeHtml(unsafe) {
    if (!unsafe) return '';
    return String(unsafe).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  function scrollToBottom(element) { if (element) element.scrollTop = element.scrollHeight; }

  // Advanced presence
  async function setupUserPresence() {
    if (!currentUser) return;
    const userRef = db.collection('users').doc(currentUser.uid);
    await userRef.update({ online: true, status: 'online', lastSeen: firebase.firestore.FieldValue.serverTimestamp(), lastActive: firebase.firestore.FieldValue.serverTimestamp() });
    userRef.onDisconnect().update({ online: false, status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    window.addEventListener('online', () => userRef.update({ online: true, status: 'online', lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{}));
    window.addEventListener('offline', () => userRef.update({ online: false, status: 'offline' }).catch(()=>{}));
    window.addEventListener('beforeunload', () => userRef.update({ online: false, status: 'offline' }).catch(()=>{}));
  }

  function setupActivityMonitor() {
    if (!currentUser) return;
    const userRef = db.collection('users').doc(currentUser.uid);
    let lastActivity = Date.now();
    function updateLastActivity() {
      lastActivity = Date.now();
      if (isAway) {
        isAway = false;
        userRef.update({ status: 'online', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
      }
      clearTimeout(activityTimeout);
      activityTimeout = setTimeout(() => {
        if (document.visibilityState === 'hidden' || (Date.now() - lastActivity > 30000)) {
          isAway = true;
          userRef.update({ status: 'away', online: true, lastActive: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
        }
      }, 30000);
    }
    ['mousedown','keydown','touchstart','mousemove','scroll'].forEach(ev => document.addEventListener(ev, updateLastActivity, { passive: true }));
    document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(activityTimeout); isAway = true; userRef.update({ status: 'away', online: true }).catch(()=>{}); } else updateLastActivity(); });
    updateLastActivity();
  }

  // Auth functions
  window.switchAuthTab = function(tab) {
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    if (tab === 'login') {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    } else {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
    }
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('registerError').style.display = 'none';
  };

  window.togglePasswordVisibility = function(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'far fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'far fa-eye';
    }
  };

  window.validateEmail = function() {
    const email = document.getElementById('email').value.trim();
    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const div = document.getElementById('emailValidation');
    if (!email) { div.style.display = 'none'; return false; }
    div.style.display = 'block';
    div.className = isValid ? 'validation-message success' : 'validation-message error';
    div.innerHTML = isValid ? '✅ البريد الإلكتروني صالح' : '❌ البريد الإلكتروني غير صالح';
    return isValid;
  };

  window.validateLoginEmail = function() {
    const email = document.getElementById('loginEmail').value.trim();
    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const div = document.getElementById('loginEmailValidation');
    if (!email) { div.style.display = 'none'; return false; }
    div.style.display = 'block';
    div.className = isValid ? 'validation-message success' : 'validation-message error';
    div.innerHTML = isValid ? '✅ البريد الإلكتروني صالح' : '❌ البريد الإلكتروني غير صالح';
    return isValid;
  };

  window.validatePassword = function() {
    const pass = document.getElementById('password').value;
    const reqs = document.getElementById('passwordReqs');
    const lengthOk = pass.length >= 8;
    const capitalOk = /[A-Z]/.test(pass);
    const numberOk = /\d/.test(pass);
    reqs.innerHTML = `
      <div style="color:${lengthOk ? '#2ecc71' : '#aaa'}">${lengthOk ? '✅' : '❌'} 8 أحرف على الأقل</div>
      <div style="color:${capitalOk ? '#2ecc71' : '#aaa'}">${capitalOk ? '✅' : '❌'} حرف كبير (A-Z)</div>
      <div style="color:${numberOk ? '#2ecc71' : '#aaa'}">${numberOk ? '✅' : '❌'} رقم (0-9)</div>
    `;
    return lengthOk && capitalOk && numberOk;
  };

  window.checkUsernameAvailability = async function() {
    const username = document.getElementById('username').value.trim();
    const checkDiv = document.getElementById('usernameCheck');
    if (username.length < 3) { checkDiv.innerHTML = ''; return; }
    checkDiv.innerHTML = '⏳ جاري التحقق...';
    clearTimeout(window.usernameTimeout);
    window.usernameTimeout = setTimeout(async () => {
      const snap = await db.collection('users').where('username', '==', username).get();
      if (snap.empty) {
        checkDiv.innerHTML = '✅ اسم المستخدم متاح';
        checkDiv.style.color = '#2ecc71';
      } else {
        checkDiv.innerHTML = '❌ اسم المستخدم غير متاح';
        checkDiv.style.color = '#e74c3c';
      }
    }, 500);
  };

  window.login = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value.trim();
    const errorDiv = document.getElementById('loginError');
    if (!email || !pass) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ الرجاء إدخال البريد وكلمة المرور';
      return;
    }
    if (!validateLoginEmail()) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ البريد الإلكتروني غير صالح';
      return;
    }
    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = err.message;
    }
  };

  window.register = async function() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    const username = document.getElementById('username').value.trim();
    const errorDiv = document.getElementById('registerError');
    if (!email || !pass || !username) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ الرجاء ملء جميع الحقول';
      return;
    }
    if (username.length > 15) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ اسم المستخدم طويل جداً (الحد الأقصى 15)';
      return;
    }
    if (!validateEmail()) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ البريد الإلكتروني غير صالح';
      return;
    }
    if (!validatePassword()) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ كلمة المرور يجب أن تحتوي على 8 أحرف، حرف كبير ورقم';
      return;
    }
    const usernameSnap = await db.collection('users').where('username', '==', username).get();
    if (!usernameSnap.empty) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ اسم المستخدم مستخدم بالفعل';
      return;
    }
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.sendEmailVerification();
      await db.collection('users').doc(cred.user.uid).set({
        username: username,
        email: email,
        online: false,
        status: 'offline',
        emailVerified: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast('✅ تم إرسال رابط التحقق إلى بريدك الإلكتروني');
      switchAuthTab('login');
      document.getElementById('loginEmail').value = email;
      await auth.signOut();
    } catch (err) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = err.message;
    }
  };

  window.googleLogin = async function() {
    try {
      await auth.signInWithPopup(googleProvider);
    } catch (err) {
      showToast('❌ فشل تسجيل الدخول بحساب Google');
    }
  };

  window.logout = async function() {
    if (currentUser) {
      await db.collection('users').doc(currentUser.uid).update({ online: false, status: 'offline' });
    }
    await auth.signOut();
  };

  // Chat functions
  function loadPublicMessages() {
    if (unsubscribePublic) unsubscribePublic();
    unsubscribePublic = db.collection('messages').orderBy('createdAt', 'asc').limit(50).onSnapshot(snap => {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      snap.forEach(doc => {
        const msg = doc.data();
        if (!msg.text && !msg.imageUrl) return;
        const div = document.createElement('div');
        div.className = `message-bubble ${msg.uid === currentUser?.uid ? 'own' : 'other'}`;
        let time = '';
        if (msg.createdAt?.toDate) {
          const d = msg.createdAt.toDate();
          time = `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
        }
        let content = '';
        if (msg.uid !== currentUser?.uid) {
          content += `<div class="message-sender">${escapeHtml(msg.username)}</div>`;
        }
        if (msg.replyTo) {
          content += `<div style="font-size:0.7rem; opacity:0.7;">↩ ${escapeHtml(msg.replyTo.username)}: ${escapeHtml(msg.replyTo.text.substring(0,30))}</div>`;
        }
        if (msg.text) content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
        if (msg.imageUrl) content += `<img src="${escapeHtml(msg.imageUrl)}" class="message-image" onclick="showFullImage('${escapeHtml(msg.imageUrl)}')">`;
        content += `<div class="message-time">${time}</div>`;
        div.innerHTML = content;
        messagesDiv.appendChild(div);
      });
      scrollToBottom(messagesDiv);
    });
  }

  function loadOnlineUsers() {
    if (unsubscribeOnline) unsubscribeOnline();
    unsubscribeOnline = db.collection('users').where('uid', '!=', currentUser?.uid).onSnapshot(snap => {
      let html = '', onlineCount = 0, awayCount = 0;
      snap.forEach(doc => {
        if (doc.id === currentUser?.uid) return;
        const data = doc.data();
        if (!data.username) return;
        const initial = data.username.charAt(0).toUpperCase();
        let statusText = '', dot = '';
        if (data.online === true) {
          if (data.status === 'online') { onlineCount++; statusText = '🟢 متصل'; dot = '<span class="status-dot"></span>'; }
          else if (data.status === 'away') { awayCount++; statusText = '🟡 غير نشط'; dot = '<span class="status-dot away" style="background:var(--away-status);"></span>'; }
          else { onlineCount++; statusText = '🟢 متصل'; dot = '<span class="status-dot"></span>'; }
        } else {
          statusText = '🔴 غير متصل';
          dot = '<span class="status-dot offline" style="background:var(--offline-status);"></span>';
        }
        html += `<div class="user-item" onclick="openPrivateChat('${doc.id}','${escapeHtml(data.username)}')">
          <div class="user-avatar">${initial}</div>
          <div class="user-info">
            <div class="user-name">${escapeHtml(data.username)}</div>
            <div class="user-status">${dot} ${statusText}</div>
          </div>
        </div>`;
      });
      document.getElementById('onlineList').innerHTML = html || '<div class="no-messages">لا يوجد مستخدمين آخرين</div>';
      document.getElementById('onlineCount').innerHTML = `${onlineCount} متصل، ${awayCount} غير نشط`;
    });
  }

  function loadTypingIndicators() {
    db.collection('typing').onSnapshot(snap => {
      const typingUsers = [];
      snap.forEach(doc => {
        if (doc.id !== currentUser?.uid && doc.data().isTyping) {
          typingUsers.push(doc.data().username);
        }
      });
      const indicator = document.getElementById('typingIndicator');
      const textSpan = document.getElementById('typingText');
      if (typingUsers.length) {
        textSpan.innerText = typingUsers.join('، ');
        indicator.style.display = 'flex';
      } else {
        indicator.style.display = 'none';
      }
    });
  }

  window.openPrivateChat = function(uid, username) {
    if (!currentUser) return;
    activePartner = { uid, username };
    document.getElementById('privatePartnerName').innerText = username;
    document.getElementById('privatePage').classList.add('show');
    const roomId = [currentUser.uid, uid].sort().join('_');
    if (unsubscribePrivate) unsubscribePrivate();
    unsubscribePrivate = db.collection('private_messages').where('roomId', '==', roomId).orderBy('createdAt').onSnapshot(snap => {
      const container = document.getElementById('privateMessages');
      container.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        const time = m.createdAt?.toDate ? `${m.createdAt.toDate().getHours()}:${m.createdAt.toDate().getMinutes().toString().padStart(2,'0')}` : '';
        const div = document.createElement('div');
        div.className = `message-bubble ${m.uid === currentUser.uid ? 'own' : 'other'}`;
        div.innerHTML = (m.uid !== currentUser.uid ? `<div class="message-sender">${escapeHtml(m.username)}</div>` : '') +
          (m.text ? `<div class="message-text">${escapeHtml(m.text)}</div>` : '') +
          (m.imageUrl ? `<img src="${escapeHtml(m.imageUrl)}" class="message-image" onclick="showFullImage('${escapeHtml(m.imageUrl)}')">` : '') +
          `<div class="message-time">${time}</div>`;
        container.appendChild(div);
      });
      scrollToBottom(container);
    });
    if (unsubscribePartner) unsubscribePartner();
    unsubscribePartner = db.collection('users').doc(uid).onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.online && d.status === 'online') document.getElementById('privateStatus').innerHTML = '🟢 متصل';
        else if (d.online && d.status === 'away') document.getElementById('privateStatus').innerHTML = '🟡 غير نشط';
        else document.getElementById('privateStatus').innerHTML = '🔴 غير متصل';
      }
    });
  };

  window.closePrivateChat = function() {
    if (unsubscribePrivate) unsubscribePrivate();
    if (unsubscribePartner) unsubscribePartner();
    activePartner = null;
    document.getElementById('privatePage').classList.remove('show');
  };

  window.sendPrivateMessage = function() {
    const txt = document.getElementById('privateInput').value.trim();
    if (!txt || !activePartner) return;
    const roomId = [currentUser.uid, activePartner.uid].sort().join('_');
    db.collection('private_messages').add({
      text: txt,
      username: currentUsername,
      uid: currentUser.uid,
      toUid: activePartner.uid,
      roomId: roomId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('privateInput').value = '';
    scrollToBottom(document.getElementById('privateMessages'));
  };

  function sendWithReply() {
    const txt = document.getElementById('messageInput').value.trim();
    if (!txt) return;
    const data = {
      text: txt,
      username: currentUsername,
      uid: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (replyingTo) data.replyTo = replyingTo;
    db.collection('messages').add(data);
    document.getElementById('messageInput').value = '';
    cancelReply();
    scrollToBottom(document.getElementById('messages'));
  }

  function handleTyping() {
    if (!currentUser) return;
    if (!isTyping) {
      isTyping = true;
      db.collection('typing').doc(currentUser.uid).set({
        username: currentUsername,
        isTyping: true,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(()=>{});
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      isTyping = false;
      db.collection('typing').doc(currentUser.uid).delete().catch(()=>{});
    }, 2000);
  }

  function handlePrivateTyping() {
    if (!currentUser || !activePartner) return;
    const roomId = [currentUser.uid, activePartner.uid].sort().join('_');
    if (!isTyping) {
      isTyping = true;
      db.collection('private_typing').doc(roomId).set({
        username: currentUsername,
        isTyping: true,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(()=>{});
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      isTyping = false;
      db.collection('private_typing').doc(roomId).delete().catch(()=>{});
    }, 2000);
  }

  window.toggleSearchBar = function() {
    const bar = document.getElementById('searchBar');
    bar.classList.toggle('show');
    if (bar.classList.contains('show')) document.getElementById('searchInput').focus();
  };
  window.closeSearchBar = function() {
    document.getElementById('searchBar').classList.remove('show');
    clearSearch();
  };
  window.searchMessages = function(term) {
    if (!term.trim()) return;
    const messages = document.querySelectorAll('.message-bubble');
    let found = false;
    messages.forEach(msg => {
      const text = msg.innerText;
      if (text.toLowerCase().includes(term.toLowerCase())) {
        msg.style.backgroundColor = '#fffaec';
        if (!found) { msg.scrollIntoView({ behavior: 'smooth', block: 'center' }); found = true; }
      } else {
        msg.style.backgroundColor = '';
      }
    });
    if (!found) showToast('❌ لا توجد رسائل مطابقة');
  };
  window.clearSearch = function() {
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.message-bubble').forEach(el => el.style.backgroundColor = '');
  };

  window.showFullImage = function(url) {
    document.getElementById('fullImage').src = url;
    document.getElementById('fullImageModal').classList.add('show');
  };
  window.toggleSidebar = function() {
    document.querySelector('.users-sidebar').classList.toggle('show');
  };
  window.toggleTheme = function() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme') || 'light';
    const next = cur === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('chat-theme', next);
  };
  window.setReply = function(id, text, username) {
    replyingTo = { id, text, username };
    document.getElementById('replyToName').innerText = username;
    document.getElementById('replyText').innerText = text.substring(0, 40) + (text.length > 40 ? '...' : '');
    document.getElementById('replyIndicator').style.display = 'flex';
  };
  window.cancelReply = function() {
    replyingTo = null;
    document.getElementById('replyIndicator').style.display = 'none';
  };

  // Image upload
  document.getElementById('imageFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)'); return; }
    if (!file.type.startsWith('image/')) { showToast('❌ الملف ليس صورة'); return; }
    selectedImageFile = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('imagePreview').src = ev.target.result;
      document.getElementById('imagePreviewContainer').classList.add('show');
      currentImageMessageContext = document.getElementById('privatePage').classList.contains('show') ? 'private' : 'public';
    };
    reader.readAsDataURL(file);
  });

  window.sendImageMessage = async function() {
    if (!selectedImageFile) return;
    document.getElementById('uploadProgress').classList.add('show');
    const fd = new FormData();
    fd.append('file', selectedImageFile);
    fd.append('upload_preset', UPLOAD_PRESET);
    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
      const data = await res.json();
      if (currentImageMessageContext === 'private' && activePartner) {
        const roomId = [currentUser.uid, activePartner.uid].sort().join('_');
        await db.collection('private_messages').add({
          imageUrl: data.secure_url,
          username: currentUsername,
          uid: currentUser.uid,
          toUid: activePartner.uid,
          roomId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        await db.collection('messages').add({
          imageUrl: data.secure_url,
          username: currentUsername,
          uid: currentUser.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      showToast('✅ تم إرسال الصورة');
    } catch (err) {
      showToast('❌ فشل إرسال الصورة');
    } finally {
      document.getElementById('uploadProgress').classList.remove('show');
      cancelImageUpload();
    }
  };

  window.cancelImageUpload = function() {
    selectedImageFile = null;
    document.getElementById('imagePreviewContainer').classList.remove('show');
    document.getElementById('imageFileInput').value = '';
  };

  // Forgot password
  window.validateResetEmail = function() {
    const email = document.getElementById('resetEmail').value.trim();
    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const div = document.getElementById('resetEmailValidation');
    if (!email) { div.style.display = 'none'; return false; }
    div.style.display = 'block';
    div.className = isValid ? 'validation-message success' : 'validation-message error';
    div.innerHTML = isValid ? '✅ البريد الإلكتروني صالح' : '❌ البريد الإلكتروني غير صالح';
    return isValid;
  };
  window.showForgotPasswordModal = function() {
    document.getElementById('forgotPasswordModal').classList.add('show');
  };
  window.hideForgotPasswordModal = function() {
    document.getElementById('forgotPasswordModal').classList.remove('show');
  };
  window.sendPasswordReset = async function() {
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) { showToast('❌ أدخل البريد الإلكتروني'); return; }
    if (!validateResetEmail()) return;
    try {
      await auth.sendPasswordResetEmail(email);
      showToast('✅ تم إرسال رابط إعادة التعيين');
      hideForgotPasswordModal();
    } catch (err) {
      showToast('❌ خطأ: ' + err.message);
    }
  };

  // Auth state listener
  auth.onAuthStateChanged(async (user) => {
    if (user && user.emailVerified) {
      currentUser = user;
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) {
        currentUsername = doc.data().username;
      } else {
        currentUsername = user.email.split('@')[0].substring(0, 15);
        await db.collection('users').doc(user.uid).set({
          username: currentUsername,
          email: user.email,
          online: true,
          status: 'online',
          emailVerified: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
          lastActive: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      await setupUserPresence();
      setupActivityMonitor();
      loadPublicMessages();
      loadOnlineUsers();
      loadTypingIndicators();
      document.getElementById('auth').style.display = 'none';
      document.getElementById('chat').style.display = 'block';
      hideLoadingScreen();
    } else {
      document.getElementById('auth').style.display = 'flex';
      document.getElementById('chat').style.display = 'none';
      if (user && !user.emailVerified) showToast('⚠️ يرجى تفعيل البريد الإلكتروني أولاً');
      hideLoadingScreen();
    }
  });

  // Event listeners
  document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendWithReply(); });
  document.getElementById('privateInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendPrivateMessage(); });

  // Load saved theme
  (function() {
    const saved = localStorage.getItem('chat-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();

  // Hide loading after timeout
  setTimeout(hideLoadingScreen, 2000);
</script>
